<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>導師資訊系統</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --color-primary:#3182ce; --color-primary-dark:#2b6cb0; --color-bg:#f7fafc;
    --color-card:#ffffff; --color-border:#e2e8f0; --color-text:#2d3748;
    --color-text-light:#4a5568; --color-muted:#a0aec0; --color-danger:#c53030;
    --color-danger-bg:#fff5f5; --color-success:#2f855a; --color-success-bg:#f0fff4;
    --color-warning:#dd6b20; --color-warning-bg:#fffaf0; --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--color-bg); color:var(--color-text); line-height:1.6; min-height:100vh;
  }
  button{font-family:inherit; cursor:pointer}
  input,select,textarea{font-family:inherit; font-size:.92rem}
  a{color:var(--color-primary)}

  /* ── 登入頁 ── */
  .login-page{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{
    background:var(--color-card); border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.08);
    padding:40px 36px; max-width:400px; width:100%; text-align:center;
  }
  .login-card h1{font-size:1.4rem; margin:0 0 6px;}
  .login-sub{color:var(--color-text-light); font-size:.88rem; margin:0 0 28px;}
  .login-fallback{font-size:.82rem; color:var(--color-text-light); margin-top:16px;}
  .login-error{font-size:.85rem; color:var(--color-danger); margin-top:14px; background:var(--color-danger-bg); padding:10px 12px; border-radius:8px;}
  #g-signin-btn{display:flex; justify-content:center;}
  .env-badge{
    display:inline-block; font-size:.68rem; font-weight:700; color:#fff; background:var(--color-warning);
    border-radius:999px; padding:2px 9px; margin-left:8px; vertical-align:middle;
  }

  /* ── App shell ── */
  #app{min-height:100vh; display:flex; flex-direction:column;}
  .app-header{
    background:var(--color-card); border-bottom:1px solid var(--color-border);
    display:flex; align-items:center; gap:16px; padding:10px 20px; flex-wrap:wrap;
  }
  .app-title{font-weight:700; font-size:1.08rem; white-space:nowrap;}
  .main-nav{display:flex; gap:4px; flex-wrap:wrap; flex:1; overflow-x:auto;}
  .nav-btn{
    border:none; background:transparent; color:var(--color-text-light); padding:8px 14px;
    border-radius:8px; font-size:.9rem; font-weight:600; white-space:nowrap;
  }
  .nav-btn:hover{background:var(--color-bg);}
  .nav-btn.active{background:var(--color-primary); color:#fff;}
  .user-box{display:flex; align-items:center; gap:8px; margin-left:auto;}
  .backend-switch{display:flex; align-items:center; gap:6px; justify-content:center; margin-top:12px;}
  .user-box .backend-switch{margin-top:0;}
  .backend-tag{font-size:.78rem; font-weight:600; color:#0b6b3a; background:#e6f6ec; border-radius:999px; padding:3px 10px;}
  .backend-tag-off{color:var(--color-text-muted, #6b7280); background:#f1f2f4; font-weight:500;}
  .user-avatar{width:30px; height:30px; border-radius:50%; background:var(--color-border);}
  .user-name{font-size:.85rem; font-weight:600; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .page-root{flex:1; padding:20px; max-width:1180px; width:100%; margin:0 auto; box-sizing:border-box;}

  /* ── 通用元件 ── */
  .btn{
    border:1px solid var(--color-border); background:#fff; color:var(--color-text);
    padding:8px 16px; border-radius:8px; font-size:.88rem; font-weight:600;
  }
  .btn:hover{background:var(--color-bg);}
  .btn-primary{background:var(--color-primary); border-color:var(--color-primary); color:#fff;}
  .btn-primary:hover{background:var(--color-primary-dark);}
  .btn-danger{background:var(--color-danger); border-color:var(--color-danger); color:#fff;}
  .btn-danger:hover{background:#9b2c2c;}
  .btn-success{background:var(--color-success); border-color:var(--color-success); color:#fff;}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-sm{padding:5px 10px; font-size:.78rem;}
  .btn:disabled{opacity:.55; cursor:not-allowed;}

  /* 儲存/送出按鈕統一回饋（withBtnPending helper 用）：按下→spinner+處理中；成功→短暫✓完成。 */
  .btn-spinner{
    display:inline-block; width:.9em; height:.9em; margin-right:6px; vertical-align:-.15em;
    border:2px solid rgba(0,0,0,.18); border-top-color:currentColor; border-radius:50%;
    animation:spin .7s linear infinite;
  }
  .btn-pending{cursor:wait;}
  .btn-pending,.btn-done{opacity:1;}
  .btn:disabled.btn-pending,.btn:disabled.btn-done{opacity:1;}
  .btn-done{background:var(--color-success); border-color:var(--color-success); color:#fff; transition:background .15s ease, color .15s ease;}

  .card{background:var(--color-card); border:1px solid var(--color-border); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
  .card h2{margin:0 0 14px; font-size:1.08rem;}
  .card h3{margin:0 0 10px; font-size:.96rem;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:.82rem; font-weight:600; color:var(--color-text-light); margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%; padding:8px 10px; border:1px solid var(--color-border); border-radius:7px; background:#fff; color:var(--color-text);
  }
  .field textarea{min-height:80px; resize:vertical;}
  /* checkbox/radio 不吃 .field input 的 width:100%/padding/border（否則撐成大方塊、位置跑掉）；
     並統一 vertical-align，修正相對中文字「偏高」的視覺問題。 */
  .field input[type="checkbox"],.field input[type="radio"]{width:auto; padding:0; border:none; background:transparent;}
  input[type="checkbox"]{vertical-align:middle; margin:0 6px 2px 0; accent-color:var(--color-primary);}
  .field-hint{font-size:.75rem; color:var(--color-muted); margin-top:4px;}
  .row{display:flex; gap:14px; flex-wrap:wrap;}
  .row > .field{flex:1; min-width:160px;}

  .badge{display:inline-block; font-size:.74rem; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .badge-pending_tutor,.badge-pending_dept,.badge-pending_staffLead,.badge-pending_director{background:var(--color-warning-bg); color:var(--color-warning);}
  .badge-muted{background:var(--color-bg); color:var(--color-muted);}
  .badge-approved{background:var(--color-success-bg); color:var(--color-success);}
  .badge-rejected{background:var(--color-danger-bg); color:var(--color-danger);}
  .badge-type{background:#ebf4ff; color:var(--color-primary-dark);}

  table{width:100%; border-collapse:collapse; font-size:.88rem;}
  th,td{text-align:left; padding:9px 8px; border-bottom:1px solid var(--color-border); vertical-align:middle;}
  th{color:var(--color-text-light); font-size:.78rem; text-transform:uppercase; letter-spacing:.02em;}
  .table-wrap{overflow-x:auto;}
  /* 表格上方的操作列：窄螢幕自動換行，按鈕之間留固定間距 */
  .admin-toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0 12px;}
  /* 可拖曳欄寬：把手貼在 th 右緣（10px 命中區），滑過才顯色，避免表頭看起來多一堆線 */
  .col-resize-handle{position:absolute; right:0; top:0; bottom:0; width:10px; cursor:col-resize; z-index:2; background:transparent;}
  .col-resize-handle:hover{background:linear-gradient(to right, transparent 40%, var(--color-border) 40%, var(--color-border) 60%, transparent 60%);}
  /* 欄寬拖窄時內容要能斷行，否則 fixed 版面下長 email／系所串會撐破欄位 */
  table[style*="table-layout: fixed"] td, table[style*="table-layout: fixed"] th{overflow-wrap:anywhere;}
  /* 匯入差異預覽（仿 Excel 統計表）：學院分頁＋系所群組列＋全欄位 inline input */
  #roster-preview-table{min-width:1060px;}
  #roster-preview-table input[type="text"]{
    width:100%; min-width:0; box-sizing:border-box; padding:4px 6px;
    border:1px solid var(--color-border); border-radius:5px; font-size:.84rem; background:#fff;
  }
  #roster-preview-table input[type="text"].roster-warn{background:var(--color-warning-bg);}
  /* 班名不合法列：比「待人工確認」的黃底更強烈——整列紅底＋左側粗紅槓＋班名欄紅框粗體。
     原本只在按下確認匯入時以 inline style 塗一次極淡的 --color-danger-bg（#fff5f5），
     使用者反映看不出來，且切換學院分頁重繪後就被沖掉。改成渲染時依班名白名單即時判定
     （renderRosterPreview 與編輯 input 事件兩處都會套），狀態跟著資料走、不會被重繪弄丟。 */
  #roster-preview-table tr.roster-row-invalid{background:#ffdede;}
  #roster-preview-table tr.roster-row-invalid > td:first-child{box-shadow:inset 4px 0 0 var(--color-danger);}
  #roster-preview-table tr.roster-row-invalid input[type="text"][data-roster-field="classNameRaw"]{
    border:2px solid var(--color-danger); background:#fff; font-weight:700; color:var(--color-danger);
  }
  #roster-preview-table tr.roster-row-invalid .roster-notes{color:var(--color-danger); font-weight:600;}
  /* 匯入結果的失敗清單：紅字改成紅框紅底區塊，和成功狀態一眼可分 */
  .import-error-box{
    background:var(--color-danger-bg); border:1px solid var(--color-danger);
    border-left:5px solid var(--color-danger); border-radius:8px; padding:10px 14px; margin-bottom:10px;
  }
  .import-error-box > .import-error-title{color:var(--color-danger); font-weight:700; margin-bottom:6px;}
  .import-error-box ul{margin:0; padding-left:20px;}
  .import-error-box li{color:var(--color-danger);}
  #roster-preview-table th:nth-child(1){width:30px;}
  #roster-preview-table th:nth-child(2),#roster-preview-table th:nth-child(3){width:118px;}
  #roster-preview-table th:nth-child(4),#roster-preview-table th:nth-child(6){width:88px;}
  #roster-preview-table th:nth-child(5),#roster-preview-table th:nth-child(7){width:148px;}
  #roster-preview-table th:nth-child(8){width:58px;}
  #roster-preview-table th:nth-child(9){width:84px;}
  .roster-dept-head td{background:var(--color-bg); font-weight:700;}
  /* 班級管理：系所群組標題列（點擊收合/展開） */
  .dept-group-head td{background:var(--color-bg); font-weight:700; cursor:pointer; user-select:none;}
  #roster-preview-table .roster-dept-head input[type="text"]{width:auto; min-width:170px; display:inline-block; font-weight:700; vertical-align:middle;}
  #roster-preview-table td.roster-notes{font-size:.8rem; color:var(--color-text-light); min-width:140px;}

  .empty-hint{color:var(--color-muted); text-align:center; padding:30px 10px; font-size:.9rem;}
  .attachment-list{list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:4px;}
  .attachment-list li{display:flex; align-items:center; gap:8px; font-size:.84rem;}

  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    border:1px solid var(--color-border); background:#fff; color:var(--color-text);
    border-radius:999px; padding:5px 13px; font-size:.84rem; font-weight:600;
  }
  .chip:hover{background:var(--color-bg);}
  .chip.active{background:var(--color-primary); border-color:var(--color-primary); color:#fff;}
  .chip-new{border-style:dashed; color:var(--color-text-light);}
  .chip-static{cursor:default;}
  .chip-static:hover{background:#fff;}
  .chip-official{background:var(--color-primary); border-color:var(--color-primary); color:#fff;}
  .chip-official:hover{background:var(--color-primary);}
  .chip-suggested{border-style:dashed; border-color:var(--color-warning); color:var(--color-warning); background:var(--color-warning-bg);}
  .chip-suggested:hover{background:var(--color-warning-bg);}
  .chip .chip-x{border:none; background:transparent; color:inherit; font-weight:700; padding:0 0 0 6px; font-size:.9em; cursor:pointer;}
  .nav-badge{
    display:inline-block; background:var(--color-danger); color:#fff; border-radius:999px;
    font-size:.68rem; font-weight:700; padding:1px 7px; margin-left:5px; vertical-align:middle;
  }

  .tab-bar{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:16px; border-bottom:1px solid var(--color-border);}
  .tab-btn{background:transparent; border:none; padding:9px 14px; font-size:.86rem; font-weight:600; color:var(--color-text-light); border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--color-primary); border-bottom-color:var(--color-primary);}

  /* ── Modal ── */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center;
    justify-content:center; z-index:1000; padding:16px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:#fff; border-radius:14px; max-width:560px; width:100%; max-height:88vh;
    overflow-y:auto; padding:24px; box-shadow:0 10px 40px rgba(0,0,0,.2);
  }
  .modal-box.modal-wide{max-width:820px;}
  .modal-title{font-size:1.05rem; font-weight:700; margin:0 0 16px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}

  /* ── Toast ── */
  #toast-container{position:fixed; top:16px; right:16px; z-index:2000; display:flex; flex-direction:column; gap:8px;}
  .toast{
    background:#2d3748; color:#fff; padding:11px 16px; border-radius:8px; font-size:.86rem;
    box-shadow:0 4px 16px rgba(0,0,0,.2); max-width:320px;
  }
  .toast-success{background:var(--color-success);}
  .toast-error{background:var(--color-danger);}
  .toast-info{background:#2d3748;}

  .stats-matrix td.qty{font-weight:700;}
  .stats-matrix .pending-note{color:var(--color-warning); font-weight:400; font-size:.78rem;}
  .stats-matrix .topic-dates{color:var(--color-text-light); font-size:.74rem; white-space:nowrap;}
  .dept-group-header td{background:var(--color-bg); font-weight:700; font-size:.86rem; padding-top:14px;}

  .loading-overlay{
    position:fixed; inset:0; background:rgba(255,255,255,.75); z-index:3000; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:10px; font-size:.9rem; color:var(--color-text-light);
  }
  .loading-overlay.open{display:flex;}
  .spinner{
    width:34px; height:34px; border:3px solid var(--color-border); border-top-color:var(--color-primary);
    border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:640px){
    .app-header{padding:8px 12px;}
    .app-title{font-size:.95rem;}
    .page-root{padding:12px;}
    .user-name{display:none;}
    table,thead,tbody,th,td,tr{display:block;}
    thead{display:none;}
    tr{border:1px solid var(--color-border); border-radius:8px; margin-bottom:10px; padding:8px 10px;}
    td{border:none; padding:4px 0; display:flex; justify-content:space-between; gap:8px;}
    td::before{content:attr(data-label); font-weight:600; color:var(--color-text-light); font-size:.76rem;}
  }
</style>
</head>
<body>

<div id="login-page" class="login-page">
  <div class="login-card">
    <h1>導師資訊系統</h1>
    <p class="login-sub">國立屏東科技大學學生諮商中心</p>
    <!-- 帳密登入（主要入口）。Google 登入預設隱藏在下方連結後面——這個平台目前的使用者
         是各系系辦助理，而他們的校內信箱不是 Google 帳號；Google 那條路只剩中心人員在用，
         擺在最前面只會讓多數人以為自己該按它。是「隱藏」不是移除，隨時可以恢復。 -->
    <div id="local-login-box">
      <p class="login-sub" style="margin-bottom:10px;">請用校內信箱與分機登入</p>
      <form id="local-login-form" autocomplete="on" style="display:flex; flex-direction:column; gap:8px;">
        <input type="text" id="local-email" placeholder="校內信箱（可只打 @ 前面那段）" autocomplete="username" required>
        <input type="password" id="local-password" placeholder="密碼（初次為校內分機）" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary" id="local-login-btn">登入</button>
      </form>
      <p id="local-login-error" class="login-error" style="display:none;"></p>
    </div>

    <div style="margin-top:16px; border-top:1px solid var(--color-border); padding-top:12px;">
      <a href="javascript:void(0)" id="show-google-login" class="field-hint" style="text-decoration:underline; cursor:pointer;">中心人員以 Google 帳號登入</a>
      <div id="google-login-box" style="display:none; margin-top:10px;">
        <div id="g-signin-btn"></div>
        <p id="login-fallback" class="login-fallback" style="display:none;">
          若登入按鈕未顯示，可能是瀏覽器封鎖了第三方登入視窗，請
          <a href="javascript:location.reload()">重新整理頁面</a>後再試一次。
        </p>
      </div>
    </div>
    <p id="login-error" class="login-error" style="display:none;"></p>
    <!-- 快速版狀態／切換（見 renderBackendSwitch）。登入頁也放一個：後端決定 session 簽在哪一邊，
         在登入之前就看得到、切得動，比登入之後才發現走錯邊好。 -->
    <div id="backend-switch-login" class="backend-switch" style="display:none;"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <header class="app-header">
    <div class="app-title">導師資訊系統</div>
    <nav id="main-nav" class="main-nav"></nav>
    <div class="user-box">
      <div id="backend-switch-header" class="backend-switch" style="display:none;"></div>
      <img id="user-avatar" class="user-avatar" alt="" />
      <span id="user-name" class="user-name"></span>
      <button id="login-history-btn" class="btn btn-ghost btn-sm">登入紀錄</button>
      <button id="logout-btn" class="btn btn-ghost btn-sm">登出</button>
    </div>
  </header>
  <main id="page-root" class="page-root"></main>
</div>

<div id="modal-overlay" class="modal-overlay">
  <div id="modal-box" class="modal-box"></div>
</div>

<div id="loading-overlay" class="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">載入中…</div>
</div>

<div id="toast-container"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// 導師資訊系統（正式版）— 前端 SPA
// 單檔 vanilla JS，架構比照 scc-infosys 的 GIS 登入 / proxyCall 慣例。
// 後端 API 定義見 dev/Code.gs（doPost dispatcher），本檔的 proxyCall 呼叫點皆以其
// 實際參數/回傳形狀為準。
// ══════════════════════════════════════════════════════════════════════════════

// ── 環境專屬常數（placeholder，勿改；由步驟 4 外部資源設置後填入實際值）──────────
const CLIENT_ID       = '68582831293-fecbka17adht886tm6oh18vrdsdg1hbj.apps.googleusercontent.com';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxsMTiA4bzY5m72nyjd2V-wiJ2e-J5374jGbXOze2iKmZRTcUznesS5kWypY_0fGw8/exec';
const ROOT_FOLDER_ID  = '1ZwVwWEQ6bUWgS_5WpKP3NF0DTlSca7Ik';

// localStorage 鍵（dev/prod 同源 npustscc.github.io，必須以 ROOT_FOLDER_ID 命名空間隔離，
// 否則 dev 密鑰簽的 session token 會被 prod 頁面撈去打 prod 後端）
const LS_USER_KEY    = 'tutor_user_' + ROOT_FOLDER_ID;      // { email, name, picture }
const LS_SESSION_KEY = 'tutor_session_' + ROOT_FOLDER_ID;   // { token, exp, email, backend }

// ── 快速版（可切換的第二個後端）─────────────────────────────────────────────────
// 入口固定是這個 GitHub Pages 網址，**後端在執行期決定**：一般版＝GAS，快速版＝中心自架的
// 後端。載入時探測一次，通了就自動用快速版（使用者 2026-08-17 決策），畫面上有按鈕可切回。
//
// 網址刻意**不寫成第 14／15 個環境專屬常數**，而是用 ROOT_FOLDER_ID 當鍵查表：
// ROOT_FOLDER_ID 本來就是 promote.mjs 與 check-env-constants 守著的環境常數，用它推導出來的
// 值不可能跟環境錯配，也不必把推行規則表從 13 條擴到 15 條——那張表每多一條就多一個漏改的

// ── 自建 session（每日登入一次）helper；localStorage 讀寫皆包 try/catch ──
function hasValidSession() {
  return !!sessionToken && sessionExp > Math.floor(Date.now() / 1000) + 30;
}
function saveSession(token, exp) {
  sessionToken = token;
  sessionExp = Number(exp) || 0;
  try {
    // backend：這個 token 是哪個後端簽的。兩個後端的 SESSION_SECRET 各自產生，一邊簽的
    // token 在另一邊必然驗不過——不記下來的話，切換後端後會拿著注定失敗的 token 一直重試。
    localStorage.setItem(LS_SESSION_KEY, JSON.stringify({
      token: token, exp: sessionExp, email: currentUser && currentUser.email, backend: activeBackend,
    }));
  } catch (e) {}
}
function clearSession() {
  sessionToken = null;
  sessionExp = 0;
  try { localStorage.removeItem(LS_SESSION_KEY); } catch (e) {}
}
// 目前 session 的 jti（登入紀錄標記「目前裝置」用）
function getSessionJti() {
  try {
    if (!sessionToken) return '';
    const p = JSON.parse(atob(sessionToken.split('.')[0].replace(/-/g, '+').replace(/_/g, '/')));
    return p.jti || '';
  } catch (e) { return ''; }
}
// 取用戶端 IP 與大致位置（供登入通知信與登入紀錄）。GAS 拿不到來源 IP，改由前端向公開 IP 服務查詢。
// best-effort：逾 3 秒或失敗一律回空物件，絕不阻斷登入。
async function fetchClientIpGeo() {
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 3000);
    const r = await fetch('https://ipapi.co/json/', { signal: ctrl.signal });
    clearTimeout(t);
    if (!r.ok) return {};
    const d = await r.json();
    const geo = [d.city, d.region, d.country_name].filter(Boolean).join(', ');
    return { ip: d.ip || '', geo: geo };
  } catch (e) { return {}; }
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

// ── 共用：可拖曳欄寬（移植自 scc-infosys 的 _makeTableResizable，含它踩過的坑）──
// infosys 把偏好存後端（那邊本來就有 user pref），本系統沒有這個機制，所以存 localStorage：
// 欄寬純屬個人視覺偏好，為它開一條會寫 config.json 的後端通道不划算，也省掉 infosys
// 2026-07-09「整檔覆寫互相蓋掉」那類風險。鍵一樣以 ROOT_FOLDER_ID 隔離 dev/prod。
const LS_COLW_KEY = 'tutor_colw_' + ROOT_FOLDER_ID;   // { [prefKey]: { 欄號: 寬度px } }

function colWidthPrefs_() {
  try { return JSON.parse(localStorage.getItem(LS_COLW_KEY) || '{}') || {}; } catch (e) { return {}; }
}
function saveColWidthPref_(prefKey, widths) {
  const all = colWidthPrefs_();
  all[prefKey] = widths;
  try { localStorage.setItem(LS_COLW_KEY, JSON.stringify(all)); } catch (e) {}
}

// table 需要有 <colgroup>（每個 <col id="{colPrefix}{n}">）與 <th data-col="{n}">，
// 且 n 的順序要與 th／td 完全一致。skipCols 裡的欄不給拉把手（例如操作欄）。
function _makeTableResizable({ table, colPrefix, colNums, prefKey, skipCols = new Set() }) {
  if (!table) return;
  const saved = colWidthPrefs_()[prefKey] || {};
  if (Object.keys(saved).length) {
    table.style.tableLayout = 'fixed';
    colNums.forEach(function (n) {
      const col = document.getElementById(colPrefix + n);
      if (col && saved[n]) col.style.width = saved[n] + 'px';
    });
  }
  table.querySelectorAll('thead th[data-col]').forEach(function (th) {
    const n = parseInt(th.dataset.col, 10);
    if (!n || skipCols.has(n) || th.querySelector('.col-resize-handle')) return;
    th.style.position = 'relative';
    const handle = document.createElement('div');
    handle.className = 'col-resize-handle';
    handle.title = '拖曳調整欄寬';
    handle.setAttribute('aria-hidden', 'true');
    let startX, startW, startTableW;
    handle.addEventListener('mousedown', function (e) {
      const col = document.getElementById(colPrefix + n);
      startX = e.pageX;
      // 切成 table-layout:fixed 之前，先把每一欄「現在的自然寬度」寫成明確 width——
      // 沒寫的話 fixed 會把欄寬重新均分，一拖就整表跳動（infosys 的原始註解）。
      table.querySelectorAll('thead th[data-col]').forEach(function (hd) {
        const i = parseInt(hd.dataset.col, 10);
        if (skipCols.has(i)) return;
        const c = document.getElementById(colPrefix + i);
        if (c && !c.style.width) c.style.width = hd.offsetWidth + 'px';
      });
      table.style.tableLayout = 'fixed';
      startTableW = table.offsetWidth;
      table.style.width = startTableW + 'px';
      startW = (col && parseInt(col.style.width, 10)) || th.offsetWidth;
      const onMove = function (ev) {
        const delta = ev.pageX - startX;
        const minTableW = colNums.length * 30;          // 每欄至少 30px
        const newTableW = Math.max(minTableW, startTableW + delta);
        const w = Math.max(30, startW + (newTableW - startTableW));
        if (col) col.style.width = w + 'px';
        table.style.width = newTableW + 'px';
      };
      const onUp = function () {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        const widths = {};
        colNums.forEach(function (i) {
          const c = document.getElementById(colPrefix + i);
          if (c && c.style.width) widths[i] = parseInt(c.style.width, 10);
        });
        saveColWidthPref_(prefKey, widths);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      e.preventDefault(); e.stopPropagation();
    });
    th.appendChild(handle);
  });
}

function _resetTableColWidths({ table, colPrefix, colNums, prefKey }) {
  saveColWidthPref_(prefKey, {});
  if (!table) return;
  table.style.tableLayout = '';
  table.style.width = '';
  colNums.forEach(function (n) {
    const col = document.getElementById(colPrefix + n);
    if (col) col.style.width = '';
  });
}

// proxyCall 往返約 1–3 秒，按鈕按下後若無回饋會讓人以為系統沒反應。統一由此 helper 包裝：
// 按下瞬間 disabled＋spinner＋「處理中…」；fn() 成功後短暫顯示「✓ 完成」再還原；失敗立刻還原
// 並把錯誤 re-throw 出去，交由呼叫端既有的 try/catch（大多會 showToast）處理，不吞錯誤。
// btn 可能在 fn() 執行期間因整頁/整區塊重繪而離開 DOM（例如儲存成功後 render 整個後台頁籤）；
// 對已離開 DOM 的節點做 classList/innerHTML/disabled 操作在 JS 裡不會報錯，因此不特別處理。
async function withBtnPending(btn, fn) {
  if (!btn) return fn();
  if (btn.disabled) return; // 已在處理中，忽略重複觸發（防連點）
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.classList.add('btn-pending');
  btn.innerHTML = '<span class="btn-spinner"></span>處理中…';
  try {
    const result = await fn();
    btn.classList.remove('btn-pending');
    btn.classList.add('btn-done');
    btn.innerHTML = '✓ 完成';
    setTimeout(function () {
      btn.classList.remove('btn-done');
      btn.innerHTML = orig;
      btn.disabled = false;
    }, 1200);
    return result;
  } catch (e) {
    btn.classList.remove('btn-pending');
    btn.innerHTML = orig;
    btn.disabled = false;
    throw e;
  }
}

// 點空白處關閉視窗：**必須是 mousedown 與 mouseup 都落在遮罩上**才算數。
// 只認 click 的話，在輸入框裡拖曳反白、滑鼠拖出視窗外才放開，click 事件的 target 會是
// 兩者的共同祖先（＝遮罩），視窗就被關掉、填到一半的內容全沒了——這是實際回報的災情。
let modalPressOnOverlay = false;
$('modal-overlay').addEventListener('mousedown', (e) => { modalPressOnOverlay = e.target.id === 'modal-overlay'; });
$('modal-overlay').addEventListener('click', (e) => {
  const wasPress = modalPressOnOverlay;
  modalPressOnOverlay = false;
  if (wasPress && e.target.id === 'modal-overlay') closeModal();
});

//    前端只是 UI 閘門，後端 classResolveCore_ 才是安全邊界）──
const CLASS_NAME_RE = /^[A-Za-z0-9一-鿿]{1,20}$/;
const DEPT_NAME_RE  = /^[A-Za-z0-9一-鿿()（）\s]{1,30}$/;
const TUTOR_NAME_RE = /^[A-Za-z0-9一-鿿·\s]{1,20}$/;
const EMAIL_RE      = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

function slugifyIdFront(name) { return String(name || '').replace(/[^A-Za-z0-9一-鿿_]/g, ''); }
// 撞既有 id 加序號後綴（同後端 uniqueDeptId_/uniqueClassId_ 模式）；existing 為含 id 的物件陣列。
function uniqueIdFront(base, existing) {
  const ids = {};
  (existing || []).forEach(function (x) { if (x && x.id) ids[x.id] = true; });
  base = base || 'id';
  if (!ids[base]) return base;
  let i = 2;
  while (ids[base + '_' + i]) i++;
  return base + '_' + i;
}
function buildClassIdFront(deptId, className, existingClasses) {
  return uniqueIdFront(deptId + '_' + slugifyIdFront(className), existingClasses);
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      const idx = result.indexOf(',');
      resolve(idx === -1 ? result : result.slice(idx + 1));
    };
    reader.onerror = () => reject(new Error('讀取檔案失敗：' + file.name));
    reader.readAsDataURL(file);
  });
}

function base64ToBlob(b64, mime) {
  const byteChars = atob(b64);
  const byteNumbers = new Array(byteChars.length);
  for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
  return new Blob([new Uint8Array(byteNumbers)], { type: mime || 'application/octet-stream' });
}

function formatDateTime(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleString('zh-TW', { hour12: false }); } catch (e) { return iso; }
}

// ── Google Identity Services 登入 ───────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════════════
window.addEventListener('load', async () => {
  applyTrackBranding();
  // 帳密登入不依賴 Google，先接起來——即使 GIS 掛掉（被擋、離線）系辦助理仍能登入。
  wireLocalLogin();

  // 先決定這次要打哪個後端，**再**初始化 Google 登入：auto_select 會自己觸發
  // handleCredentialResponse → sessionStart，後端沒選好的話 session 會簽在錯的一邊。
  // 探測最多 FAST_BACKEND_URL 設定的逾時（通常 <100ms），沒設定快速版時整段直接跳過。
  await resolveBackend();
  renderBackendSwitch();

  if (!CLIENT_ID || CLIENT_ID.indexOf('__') === 0) {
    showLoginError('尚未設定 Google OAuth Client ID。');
    return;
  }

  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: handleCredentialResponse,
    auto_select: true,
    use_fedcm_for_prompt: true,
  });
  google.accounts.id.renderButton($('g-signin-btn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'zh-TW' });

  setTimeout(() => {
    if ($('g-signin-btn') && !$('g-signin-btn').firstElementChild) $('login-fallback').style.display = '';
  }, 1500);

  // 一次性清除舊機制的 sessionStorage 鍵（登入狀態已改存 localStorage 的自建 session）
  try { sessionStorage.removeItem('tutor_user'); sessionStorage.removeItem('tutor_idtoken'); } catch (e) {}

  // 從 localStorage 恢復：session 有效 → 直接進系統（完全不碰 Google）；
  // session 過期但 user 存在（昨天登入過）→ One Tap 靜默重登（成功會走
  // handleCredentialResponse → sessionStart 換新 session）；都沒有 → 停在登入畫面。
  let storedUser = null, storedSession = null;
  try {
    storedUser = JSON.parse(localStorage.getItem(LS_USER_KEY) || 'null');
    storedSession = JSON.parse(localStorage.getItem(LS_SESSION_KEY) || 'null');
  } catch (e) {}
  if (!(storedUser && storedUser.email) && isSelfHosted()) {
    // 沒有使用者資料就進不了主畫面 → 回 login.html。**先把 session 鍵一起清掉**：
    // login.html 看到「session 還有效」會立刻把人送回 index.html，兩邊互踢就是無窮迴圈。
    try { localStorage.removeItem(LS_SESSION_KEY); } catch (e) {}
    location.href = './login.html';
    return;
  }
  if (storedUser && storedUser.email) {
    currentUser = storedUser;
    // 後端不同的 session 一律作廢：兩邊的 SESSION_SECRET 各自產生，另一邊簽的 token 拿去
    // 驗必然是 'Session expired'，留著只會多打一輪後端再靜默重登。舊資料沒有 backend 欄位，
    // 視為一般版（那時只有一個後端）。
    const sameBackend = (storedSession && (storedSession.backend || 'normal')) === activeBackend;
    const valid = storedSession && storedSession.token &&
                  storedSession.email === storedUser.email && sameBackend &&
                  Number(storedSession.exp) > Math.floor(Date.now() / 1000) + 30;
    if (valid) {
      sessionToken = storedSession.token;
      sessionExp = Number(storedSession.exp);
      showLoading('自動登入中…');
      afterLogin();
    } else if (isSelfHosted()) {
      // 自架軌：昨天登入過但今天的 session 已過期 → 回 login.html 重打帳密。
      clearSession();
      location.href = './login.html';
      return;
    } else {
      clearSession();
      showLoading('驗證身分中…');
      google.accounts.id.prompt((n) => {
        if (n && ((n.isNotDisplayed && n.isNotDisplayed()) || (n.isSkippedMoment && n.isSkippedMoment()))) {
          hideLoading();
          try { localStorage.removeItem(LS_USER_KEY); } catch (e) {}
          currentUser = null;
        }
      });
    }
  }
});

function decodeJwt(token) {
  try {
    const b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(atob(b64).split('').map((c) => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('')));
  } catch (e) { return null; }
}

async function handleCredentialResponse(response) {
  const payload = decodeJwt(response.credential);
  if (!payload) { showLoginError('登入憑證解析失敗，請重新整理頁面再試。'); return; }
  const isRefresh = !!bootstrapData && currentUser && currentUser.email === payload.email;
  currentUser = { email: payload.email, name: payload.name, picture: payload.picture };
  gIdToken = response.credential;   // 只留記憶體，不再持久化
  try { localStorage.setItem(LS_USER_KEY, JSON.stringify(currentUser)); } catch (e) {}
  hideReloginModal();

  // 每日首次登入：以 idToken 打 sessionStart 換發自建 session token（效期至當日台北 24:00）。
  // sessionStart 失敗不阻斷登入——降級為記憶體 idToken 模式（doPost 的 idToken 路徑保留），
  // SESSION_SECRET 尚未設置或後端異常時系統仍可用（效期一小時）。
  clearSession();
  try {
    const ipgeo = await fetchClientIpGeo();  // best-effort，失敗回空物件、不阻斷登入
    const s = await proxyCall('sessionStart', {
      ua: navigator.userAgent.slice(0, 200), ip: ipgeo.ip || '', geo: ipgeo.geo || '',
    });
    saveSession(s.sessionToken, s.exp);
    // 有角色的帳號會收到登入通知信；Gmail 可能把它分到垃圾郵件/促銷，主動提醒一次
    if (s.mailSent) showToast('已寄出登入通知信；若未在收件匣，請檢查垃圾郵件分類', 'info');
  } catch (e) {
    // 被全域登入閘門擋下不是「簽發失敗」，不能降級繼續——降級的話會接著跑 afterLogin，
    // 使用者先看到一個誤導的「憑證簽發失敗」toast，再看到真正的原因。就停在這裡說明。
    if (e && e.accessRestricted) {
      gIdToken = null;
      if (refreshResolve) { const r = refreshResolve; refreshResolve = null; refreshPromise = null; r(false); }
      showLoginError(e.message);
      return;
    }
    console.error('sessionStart 失敗，降級為一小時效期登入：', e);
    showToast('登入憑證簽發失敗，本次以一小時效期登入', 'error');
  }

  // sessionStart 完成後才 resolve pending promise，讓等待中的 proxyCall 重試時已有新 session
  if (refreshResolve) { const r = refreshResolve; refreshResolve = null; refreshPromise = null; r(true); }
  if (isRefresh) { showToast('登入已於背景更新', 'success'); return; }
  afterLogin();
}

// 重走 Google 登入（One Tap 靜默優先，8 秒內沒完成 → relogin modal）。
// 成功時 handleCredentialResponse 會自動打 sessionStart 換發新 session，
// 之後才 resolve——await 本函式回來時新 session 已就緒，可直接重試原請求。
function refreshIdToken() {
  // 自架軌沒有 Google 登入可走：憑證到期就直接回 login.html 本地帳密重登。
  // （原本會跳出一個掛著 Google 按鈕的「登入已到期」視窗，在這裡按下去必然失敗。）
  if (isSelfHosted()) {
    try { localStorage.removeItem(LS_SESSION_KEY); } catch (e) {}
    location.href = './login.html';
    return new Promise(function () {});  // 永不 resolve：頁面正在跳轉，呼叫端不該繼續重試
  }
  if (refreshPromise) return refreshPromise;
  refreshPromise = new Promise((resolve) => { refreshResolve = resolve; });
  const timer = setTimeout(() => { if (refreshResolve) showReloginModal(); }, 8000);
  try {
    google.accounts.id.prompt((n) => {
      if (n && ((n.isNotDisplayed && n.isNotDisplayed()) || (n.isSkippedMoment && n.isSkippedMoment()))) {
        if (refreshResolve) showReloginModal();
      }
    });
  } catch (e) { if (refreshResolve) showReloginModal(); }
  refreshPromise.finally(() => clearTimeout(timer));
  return refreshPromise;
}

function showReloginModal() {
  openModal('登入已到期', '<p style="color:var(--color-text-light); font-size:.9rem;">今日登入憑證已到期（每日 00:00 重置），請重新登入以繼續（畫面上的資料不會遺失）。</p><div id="relogin-btn-slot" style="display:flex; justify-content:center; margin-top:10px;"></div>');
  try { google.accounts.id.renderButton($('relogin-btn-slot'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'zh-TW' }); } catch (e) {}
}
function hideReloginModal() {
  if ($('modal-box').querySelector('#relogin-btn-slot')) closeModal();
}

// 免憑證呼叫：只給 localLogin / localChangePassword 用（它們自己就是認證，
// 走 proxyCall 會因為「尚未登入」在前端就被擋下）。回傳後端 data 物件原樣，
// 由呼叫端自行判斷 data.error——後端對這兩個 action 一律回 200＋{error}，不透露帳號是否存在。
// GAS 偶發把 POST 降級成 GET（打到 doGet，回 {ok,service,via:'doGet',hasPayload:false}）。
// 2026-07-14 與 2026-08-11 各出現一次，使用者兩次都撞牆。
// **這個形狀可以安全重試**：hasPayload:false 證明 payload 根本沒送達，doPost 沒被執行過，
// 不可能有半套寫入——所以連 upsert/刪除這種會改資料的 action 重送都不會重複套用。
// 只認這個很窄的簽名，其他任何回應一律照舊往上拋，不要把「真的失敗」也悶著重試。
function isGasDowngradedResponse(data) {
  return !!data && data.ok === true && typeof data.service === 'string' &&
    (data.via === 'doGet' || data.hasPayload === false);
}

async function proxyCallNoAuth(action, params, retryHttp) {
  retryHttp = retryHttp || 0;
  const payload = JSON.stringify(Object.assign({ action: action, rootFolderId: ROOT_FOLDER_ID }, params || {}));
  const form = new URLSearchParams();
  form.append('payload', payload);
  let res;
  try {
    res = await fetch(activeBackendUrl, { method: 'POST', body: form });
  } catch (e) {
    throw new Error('網路連線失敗，請確認網路後再試一次。');
  }
  // GAS 偶發回 404/503（請求其實已送達並執行）。proxyCall 本來就有這段重試，
  // 這支當初漏了——使用者實際踩到：改密碼成功了、畫面卻報錯，再送一次變成「目前密碼錯誤」。
  // 後端的 localChangePassword 已改為冪等，所以重試是安全的。
  if (!res.ok && (res.status === 404 || res.status === 503) && retryHttp < 2) {
    await sleep(1200 * (retryHttp + 1));
    return proxyCallNoAuth(action, params, retryHttp + 1);
  }
  if (!res.ok) throw new Error('伺服器回應 ' + res.status);
  const json = await res.json();
  if (json && json.success === false) throw new Error(json.error || '登入失敗');
  const data = (json && json.data) || {};
  if (isGasDowngradedResponse(data) && retryHttp < 2) {
    await sleep(900 * (retryHttp + 1));
    return proxyCallNoAuth(action, params, retryHttp + 1);
  }
  return data;
}

// ── 帳密登入（系辦助理；GAS 軌與自架軌都可用）────────────────────────────────
// 自架軌的入口是 server 提供的 login.html（那邊有自己的表單），這裡這份是給 GAS 軌用的——
// 兩邊最後都走同一套 session（issueSessionToken_ 簽發的 HMAC token）。
async function doLocalLogin(email, password) {
  const res = await proxyCallNoAuth('localLogin', { email: email, password: password });
  if (res && res.error) throw new Error(res.error);
  currentUser = { email: res.email, name: res.name || res.email, picture: '' };
  try { localStorage.setItem(LS_USER_KEY, JSON.stringify(currentUser)); } catch (e) {}
  saveSession(res.sessionToken, res.exp);
  return res;
}

// GAS 軌的品牌名：這個平台目前只做一件事——讓各系系辦助理維護本系導師名冊（含聯絡方式），
// 叫「導師資訊系統」會讓人以為班會紀錄/核章也在這裡（那套在校內自架站）。
// 2026-08-11 由「各系導師電話上傳表單」改名為「各系導師名冊」：欄位已不只電話，
// 也不是一次性的「上傳表單」而是持續維護的名冊。
// 只改 GAS 軌：自架站仍是完整的導師資訊系統，名稱不動。
// 靜態 <title>／badge 保持原樣不動，改在執行時覆蓋——promote.mjs 的 13 條規則比對的是
// 原始字串，改動它們會讓推行流程失配。
const GAS_APP_TITLE_ = '各系導師名冊';
function applyTrackBranding() {
  if (isSelfHosted()) return;
  const isDev = /（測試版）/.test(document.title) || !!document.querySelector('.env-badge');
  document.title = GAS_APP_TITLE_ + (isDev ? '（測試版）' : '');
  document.querySelectorAll('#login-page h1, .app-title').forEach(function (el) {
    const badge = el.querySelector('.env-badge');
    el.textContent = GAS_APP_TITLE_;
    if (badge) el.appendChild(badge);
  });
}

function wireLocalLogin() {
  const form = $('local-login-form');
  if (!form) return;
  const gLink = $('show-google-login');
  if (gLink) {
    gLink.addEventListener('click', function () {
      $('google-login-box').style.display = '';
      gLink.style.display = 'none';
    });
  }
  // 自架軌不顯示這一區：那邊的登入在 login.html，index.html 根本不該停在登入畫面。
  if (isSelfHosted()) { $('local-login-box').style.display = 'none'; return; }
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const errEl = $('local-login-error');
    errEl.style.display = 'none';
    const btn = $('local-login-btn');
    try {
      await withBtnPending(btn, async function () {
        const res = await doLocalLogin($('local-email').value.trim(), $('local-password').value);
        if (res.mustChangePassword) {
          // 初始密碼＝校內分機，而分機在系所官網公開查得到——在公開網路上這等於沒有密碼，
          // 所以這一軌**不給「稍後再做」**，必須先改掉才進系統。
          showForcedChangePassword(res.email, $('local-password').value);
          return;
        }
        afterLogin();
      });
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = '';
    }
  });
}

function showForcedChangePassword(email, currentPassword) {
  openModal('請先設定新密碼', '<p class="field-hint">您目前使用的是初始密碼（校內分機）。' +
    '分機在系所網站上公開查得到，等於任何人都能登入您的帳號，因此<b>必須先更改密碼</b>才能繼續。</p>' +
    '<form id="force-pw-form">' +
    '<div class="field"><label>新密碼</label><input type="password" id="force-pw1" placeholder="至少 8 個字元，不能只有數字" required></div>' +
    '<div class="field"><label>再輸入一次</label><input type="password" id="force-pw2" required></div>' +
    '<p id="force-pw-error" class="login-error" style="display:none;"></p>' +
    '<div class="modal-actions"><button type="submit" class="btn btn-primary">更改密碼並進入系統</button></div></form>');
  $('force-pw-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const errEl = $('force-pw-error');
    errEl.style.display = 'none';
    if ($('force-pw1').value !== $('force-pw2').value) {
      errEl.textContent = '兩次輸入的新密碼不一致'; errEl.style.display = ''; return;
    }
    const btn = e.target.querySelector('button[type=submit]');
    try {
      await withBtnPending(btn, async function () {
        const res = await proxyCallNoAuth('localChangePassword', {
          email: email, currentPassword: currentPassword, newPassword: $('force-pw1').value,
        });
        if (res && res.error) throw new Error(res.error);
        closeModal();
        afterLogin();
      });
    } catch (err) {
      errEl.innerHTML = escapeHtml(err.message) +
        '<br><span class="field-hint">若您已經送出過一次，密碼可能已經更改成功——請重新整理頁面，改用<b>新密碼</b>登入試試。</span>';
      errEl.style.display = '';
    }
  });
}

// 自架伺服器版？——build-public.js 會把 APPS_SCRIPT_URL 換成本機 origin，所以「不是
// script.google.com」就是自架軌。自架軌**沒有 Google 登入**（區網 IP 不是 Google OAuth 的
// 合法 origin），登入一律走 server 提供的 login.html 本地帳密。
// 注意：這問的是「**這份前端**是誰服務的」，不是「現在打哪個後端」。從 Pages 切到快速版時
// 這個函式仍然回 false——頁面來源還是 npustscc.github.io，Google 登入照樣可用（這正是
// 「Pages 當入口、後端可切換」比「直接連自架站」好的地方）。要問後端看 activeBackend。
function isSelfHosted() {
  return !/^https:\/\/script\.google\.com\//.test(APPS_SCRIPT_URL);
}

// ══════════════════════════════════════════════════════════════════════════════
// ── 快速版：探測、選擇、切換 ─────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════════════
// 探測是 GET /healthz，簡單請求；快速版那端必須回 Access-Control-Allow-Origin 才讀得到。
// 失敗（離線、逾時、CORS 沒開、憑證有問題）一律當成離線——fail-closed 到一般版，
// 那是永遠在的那一個。
async function probeFastBackend() {
  if (!FAST_BACKEND_URL) return false;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FAST_PROBE_TIMEOUT_MS);
  try {
    const r = await fetch(FAST_BACKEND_URL + '/healthz', { signal: ctrl.signal, cache: 'no-store' });
    return r.ok;
  } catch (e) {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

// 決定這次載入要打誰。**必須在 Google 登入初始化之前跑完**：auto_select 會自己觸發
// handleCredentialResponse → sessionStart，那時後端要是還沒選好，session 就會簽在錯的一邊。
async function resolveBackend() {
  if (isSelfHosted() || !FAST_BACKEND_URL) return;   // 已經在自架站上／這個環境還沒有快速版
  fastBackendOnline = await probeFastBackend();
  let pref = null;
  try { pref = sessionStorage.getItem(SS_BACKEND_PREF_KEY); } catch (e) {}
  const useFast = fastBackendOnline && pref !== 'normal';
  activeBackend = useFast ? 'fast' : 'normal';
  activeBackendUrl = useFast ? (FAST_BACKEND_URL + '/exec') : APPS_SCRIPT_URL;
}

// 切換＝寫下覆寫、清掉 session（另一邊驗不過）、重新載入。整頁重載是刻意的：
// 後端換了之後 bootstrap、快取、附件路徑全都要重來，就地換比重載更容易留下不一致的狀態。
function switchBackend(to) {
  try { sessionStorage.setItem(SS_BACKEND_PREF_KEY, to); } catch (e) {}
  clearSession();
  location.reload();
}

// 按鈕：登入頁與主畫面各一個容器，同一段狀態。文案不出現任何伺服器/主機名稱。
function renderBackendSwitch() {
  const boxes = [$('backend-switch-login'), $('backend-switch-header')].filter(Boolean);
  if (!boxes.length) return;
  const show = !isSelfHosted() && !!FAST_BACKEND_URL;
  boxes.forEach((box) => {
    box.style.display = show ? '' : 'none';
    if (!show) return;
    if (activeBackend === 'fast') {
      box.innerHTML = '<span class="backend-tag">⚡ 快速版</span>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-backend="normal">切回一般版</button>';
    } else if (fastBackendOnline) {
      box.innerHTML = '<button type="button" class="btn btn-ghost btn-sm" data-backend="fast">⚡ 快速版：已上線 ▸ 切換</button>';
    } else {
      box.innerHTML = '<span class="backend-tag backend-tag-off">快速版：目前離線</span>';
    }
    box.querySelectorAll('button[data-backend]').forEach((b) => {
      b.addEventListener('click', () => switchBackend(b.getAttribute('data-backend')));
    });
  });
}

// 本機登出（清鍵）；主動按「登出」時先請後端註銷該帳號全部裝置的 token（best-effort）。
// 自架軌要導回 login.html——原本一律 location.reload()，重載 index.html 後會落到內建的
// Google 登入畫面，而那個畫面在自架環境按下去必然失敗（使用者得手動把網址的 index.html
// 刪掉才回得了登入頁）。GAS 軌維持原本的 reload（那邊的登入畫面就是對的）。
function localSignOut() {
  try { localStorage.removeItem(LS_USER_KEY); localStorage.removeItem(LS_SESSION_KEY); } catch (e) {}
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  if (isSelfHosted()) { location.href = './login.html'; return; }
  location.reload();
}
$('logout-btn').addEventListener('click', async (e) => {
  // 只在本機 session 仍有效時 best-effort 註銷；session 已過期就直接本機登出，
  // 避免登出動作反而觸發 proxyCall 的「靜默重登→重試」流程跳出登入視窗。
  await withBtnPending(e.currentTarget, async function () {
    if (hasValidSession()) {
      try { await proxyCall('sessionLogout'); } catch (err) { /* 註銷失敗不阻斷登出 */ }
    }
    localSignOut();
  });
});

// ── 登入紀錄（modal）：近期以此帳號登入的裝置/IP/位置；可一鍵登出所有裝置 ──
$('login-history-btn').addEventListener('click', () => showLoginHistory());

async function showLoginHistory() {
  openModal('登入紀錄',
    '<p class="field-hint">近期以你的帳號登入本系統的裝置、IP 與大致位置。若發現非本人登入，請按「登出所有裝置」使所有登入憑證即時失效，並儘速更改 Google 密碼、聯繫系統管理者。</p>' +
    '<div id="login-history-body" class="field-hint">載入中…</div>' +
    '<div class="modal-actions">' +
      '<button class="btn btn-danger btn-sm" data-action="logout-all-devices">登出所有裝置</button>' +
      '<button class="btn btn-sm" data-action="close-modal">關閉</button>' +
    '</div>');
  const body = $('login-history-body');
  let list = [];
  try {
    const r = await proxyCall('listMySessions', { currentJti: getSessionJti() });
    list = (r && r.sessions) || [];
  } catch (e) {
    body.innerHTML = '<span style="color:var(--color-danger);">登入紀錄載入失敗：' + escapeHtml(e.message) + '</span>';
    return;
  }
  if (!list.length) { body.textContent = '目前沒有登入紀錄。'; return; }
  const fmt = (iso) => { try { return new Date(iso).toLocaleString('zh-TW', { hour12: false }); } catch (e) { return iso || ''; } };
  const uaShort = (ua) => {
    if (!ua) return '（未知裝置）';
    const os = /Windows/.test(ua) ? 'Windows' : /iPhone|iPad|iOS/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : '其他';
    const br = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : '瀏覽器';
    return os + '・' + br;
  };
  body.innerHTML = list.map((s) => {
    const badge = s.current ? '<span class="badge badge-approved">目前裝置</span>'
      : s.active ? '<span class="badge badge-pending_tutor">使用中</span>'
      : s.revoked ? '<span class="badge badge-rejected">已登出</span>'
      : '<span class="badge badge-muted">已過期</span>';
    return '<div style="padding:8px 0; border-bottom:1px solid var(--color-border);">' +
      '<div><strong>' + escapeHtml(uaShort(s.ua)) + '</strong> ' + badge + '</div>' +
      '<div class="field-hint">登入時間：' + escapeHtml(fmt(s.issuedAt)) + '</div>' +
      '<div class="field-hint">IP：' + escapeHtml(s.ip || '（未取得）') + (s.geo ? '　位置：' + escapeHtml(s.geo) : '') + '</div>' +
    '</div>';
  }).join('');
}

document.body.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action="logout-all-devices"]');
  if (!btn) return;
  if (!confirm('確定要登出所有裝置嗎？\n\n所有目前有效的登入憑證（包含本裝置與其他電腦）都會立即失效，下次都需要重新登入。')) return;
  try {
    await withBtnPending(btn, async function () {
      await proxyCall('sessionLogout');
      showToast('已登出所有裝置，即將回到登入畫面…', 'success');
      setTimeout(() => localSignOut(), 800);
    });
  } catch (err) {
    showToast('登出所有裝置失敗：' + err.message, 'error');
  }
});

// ══════════════════════════════════════════════════════════════════════════════
// ── proxyCall：呼叫 GAS doPost 的統一入口 ─────────────────────────────────────
// 回應形狀（見 dev/Code.gs）：
//   - action 內部 throw               → doPost 外層 catch → { success:false, error }
//   - action 正常回傳                  → { success:true, data:{ ...實際結果... } }
//   - doPost 認證/switch 分派層直接回應 → { success:true, data:{ error:'Unauthorized'|'Unknown action: ...' } }
// 因此兩種「看起來成功但其實是錯誤」的形狀都要擋下來，統一以 throw 往上拋。
// ══════════════════════════════════════════════════════════════════════════════
async function proxyCall(action, params, retryHttp, retryAuth) {
  params = params || {}; retryHttp = retryHttp || 0; retryAuth = retryAuth || 0;
  // sessionStart 一律走 idToken（後端不許以舊 session 換新）；其他 action 有有效 session 就帶 sessionToken
  const useSession = action !== 'sessionStart' && hasValidSession();
  if (!useSession && !gIdToken) {
    // 恢復的分頁跨過午夜：沒有效 session 也沒記憶體 idToken → 先靜默重登再重試一次
    if (action !== 'sessionStart' && currentUser && retryAuth < 1) {
      await refreshIdToken();
      return proxyCall(action, params, retryHttp, retryAuth + 1);
    }
    throw new Error('尚未登入，請重新整理頁面登入。');
  }

  const payload = JSON.stringify(Object.assign(
    { action: action, rootFolderId: ROOT_FOLDER_ID },
    useSession ? { sessionToken: sessionToken } : { idToken: gIdToken },
    params
  ));
  const form = new URLSearchParams();
  form.append('payload', payload);

  let res;
  try {
    res = await fetch(activeBackendUrl, { method: 'POST', body: form });
  } catch (e) {
    throw new Error('網路連線失敗，請確認網路後再試一次。');
  }

  if (!res.ok) {
    if ((res.status === 404 || res.status === 503) && retryHttp < 2) {
      await sleep(1200 * (retryHttp + 1));
      return proxyCall(action, params, retryHttp + 1, retryAuth);
    }
    throw new Error('伺服器錯誤（HTTP ' + res.status + '）');
  }

  const data = await res.json();
  // 先擋 GAS 的 POST→GET 降級（它長得像成功，但其實什麼都沒執行）
  if (isGasDowngradedResponse(data && data.data) && retryHttp < 2) {
    await sleep(900 * (retryHttp + 1));
    return proxyCall(action, params, retryHttp + 1, retryAuth);
  }
  const err = (data.success === false)
    ? data.error
    : (data.data && typeof data.data === 'object' && data.data.error) ? data.data.error : null;

  if (err) {
    // 全域登入閘門擋下（後端 checkSystemAccess_）：這個人本來就不准進來，重試沒有意義，
    // 也不要走下面那條「靜默重走 Google 登入」——那會讓畫面卡在登入迴圈而不是說明原因。
    // 清掉 session 避免下次載入又拿著憑證重來一輪。
    if (err === 'AccessRestricted') {
      const msg = (data.data && data.data.message) ||
        '系統目前僅開放學諮中心人員與各系系辦助理使用。';
      clearSession();
      const e = new Error(msg);
      e.accessRestricted = true;   // afterLogin 據此改用原文顯示，不加「讀取資料失敗：」前綴
      throw e;
    }
    // 過午夜或 token 失效/竄改：清 session → 靜默重走 Google 登入（handleCredentialResponse
    // 會自動打 sessionStart 換新 session）→ 重試一次。sessionStart 自己失敗不重試
    // （防 refreshIdToken → sessionStart → 又失敗的迴圈），retryAuth < 1 防整體重試迴圈。
    if ((err === 'Session expired' || err === 'Unauthorized') && action !== 'sessionStart' && retryAuth < 1) {
      clearSession();
      await refreshIdToken();
      return proxyCall(action, params, retryHttp, retryAuth + 1);
    }
    throw new Error(err);
  }
  return data.data;
}

// ══════════════════════════════════════════════════════════════════════════════
// ── 登入後流程：bootstrap ──────────────────────────────────────────────────
// bootstrapAction_（Code.gs）一次回傳 email/roles/departments/classes/semesters/
// semester/records/settings/(admin 才有 users)。roles 已由後端 resolveRoles_ 算好，
// 前端只需依 roles 決定 UI 顯示，不必自己重算角色。
// ══════════════════════════════════════════════════════════════════════════════
async function loadBootstrap(semester) {
  const params = semester ? { semester: semester } : {};
  const data = await proxyCall('bootstrap', params);
  // 後端 bootstrap 必回傳 roles 物件；缺少代表這不是 doPost 的 bootstrap 回應（曾發生：
  // 2026-07-14 使用者環境拿到疑似 doGet 的 {ok,service}，前端在 renderNav 炸 TypeError）。
  // 擋在這裡並把實際內容帶進錯誤訊息，讓登入畫面直接顯示收到什麼，以利回報診斷。
  if (!data || !data.roles) {
    throw new Error('bootstrap 回應異常，請截圖回報。實際收到：' + JSON.stringify(data).slice(0, 180));
  }
  bootstrapData = data;
  return data;
}

async function afterLogin() {
  showLoading('讀取使用者設定…');
  $('login-page').style.display = 'none';
  try {
    await loadBootstrap();
    $('user-avatar').src = currentUser.picture || '';
    $('user-name').textContent = currentUser.name || currentUser.email;
    $('app').style.display = '';
    renderNav();
    showPage(defaultPageId());
  } catch (e) {
    // 被全域登入閘門擋下不寫 console.error：那不是錯誤，是設計好的狀態。
    // （e2e 把 console error 當成品質指標，把預期中的狀態記成錯誤會讓那個指標失去意義。）
    if (!(e && e.accessRestricted)) console.error(e);
    $('app').style.display = 'none';
    $('login-page').style.display = '';
    // 被全域登入閘門擋下：那不是「失敗」，是系統現在就不開放給這個人，照原文顯示。
    showLoginError(e && e.accessRestricted ? e.message : '讀取資料失敗：' + e.message);
  } finally {
    hideLoading();
  }
}

async function refreshBootstrap(semester) {
  showLoading('重新整理資料…');
  try {
    // 資料剛被改動（上傳/核章/退件…）才會走到這裡，各頁的快取一律作廢，不要拿舊的先畫。
    pageDataCache.clear();
    await loadBootstrap(semester || (bootstrapData && bootstrapData.semester));
    renderNav();
    if (currentPage) showPage(currentPage);
  } finally {
    hideLoading();
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// ── 分頁資料快取（stale-while-revalidate）─────────────────────────────────────
// 「我的上傳／導師個人後台／全校總表／導師資料」四頁的資料不在 bootstrap 裡，每次切頁
// 都要各自打一趟 API。GAS 軌光是一次往返就要 1.3–1.5 秒，切回剛看過的頁還要再等一次，
// 使用者回報「切頁很不順」。做法：**先把上一次的結果畫出來，同時在背景重抓**，內容有變
// 才重畫（JSON 字串比對），沒變就完全不動畫面。第一次進入該頁仍照舊顯示「載入中…」。
//
// 一致性：任何會改資料的動作都走 refreshBootstrap（上面已整批清空），導師資料頁的增刪
// 則在該頁自己清；讀到的最舊也只舊到「上次看的那一眼」，而且背景那趟一定會校正回來。
// ══════════════════════════════════════════════════════════════════════════════
const pageDataCache = new Map();   // key → { json, data }

// 某個 action 的資料剛被自己改過（不走 refreshBootstrap 的那些）：把它全部參數組合的
// 快取丟掉，下一趟一定重抓，不會先閃一下改動前的舊表。
function invalidatePageData(action) {
  Array.from(pageDataCache.keys()).forEach(function (k) {
    if (k.indexOf(action + ':') === 0) pageDataCache.delete(k);
  });
}

async function loadPageData(o) {
  const key = o.action + ':' + JSON.stringify(o.params || {});
  const cached = pageDataCache.get(key);
  // 回應回來時使用者可能已經切走（或換了學期/系所）：slot 節點已從畫面上被換掉，
  // 這時硬寫 innerHTML 會炸 null。o.valid 讓呼叫端補「選單條件有沒有變」的判斷。
  const stillWanted = function () {
    const el = $(o.slot);
    return !!el && el.isConnected && (!o.valid || o.valid());
  };
  if (cached) o.render(cached.data);
  else { const el = $(o.slot); if (el) el.innerHTML = '<div class="empty-hint">載入中…</div>'; }
  try {
    const res = await proxyCall(o.action, o.params);
    if (!stillWanted()) return;
    const json = JSON.stringify(res);
    if (!cached || cached.json !== json) o.render(res);
    pageDataCache.set(key, { json: json, data: res });
  } catch (e) {
    if (!stillWanted()) return;
    // 畫面上已經有（舊的）資料時不要清掉改成錯誤訊息——背景更新失敗用 toast 講就好。
    if (cached) showToast('更新失敗：' + e.message, 'error');
    else $(o.slot).innerHTML = '<div class="empty-hint">載入失敗：' + escapeHtml(e.message) + '</div>';
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// ── 導覽 / 路由 ──────────────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════════════
const NAV_PAGES = [
  { id: 'upload', label: '上傳', show: function (r) { return recordFlowVisible_(r); } },
  { id: 'mine',   label: '我的上傳', show: function (r) { return recordFlowVisible_(r); } },
  { id: 'myclasses', label: '導師個人後台', show: function (r) { return r.tutorOf.length > 0; } },
  { id: 'queue',  label: '核章匣', show: function (r) { return recordFlowVisible_(r) && (r.tutorOf.length > 0 || r.deptHeadOf.length > 0 || r.isDirector || r.isAdmin || r.isStaffLead || r.isStaffAssistant); } },
  { id: 'stats',  label: '班級統計', show: function (r) { return recordFlowVisible_(r) && (r.tutorOf.length > 0 || r.deptHeadOf.length > 0 || r.isDirector || r.isAdmin); } },
  { id: 'overview', label: '全校總表', show: function (r) { return recordFlowVisible_(r) && (r.isAdmin || r.isDirector || r.isStaffLead || r.isStaffAssistant || r.deptHeadOf.length > 0); } },
  // 系辦助理的導師名冊頁（Phase 1 唯讀）。roles.deptAssistantOf 是後端算好的授權集合，
  // 前端只拿它決定「顯不顯示這個頁籤」；能不能真的讀到資料由後端 deptRosterGet 再驗一次。
  { id: 'deptroster', label: '導師資料', show: function (r) { return (r.deptAssistantOf || []).length > 0 || r.isAdmin; } },
  { id: 'admin',  label: '後台管理', show: function (r) { return r.isAdmin; } },
];
const PAGE_RENDERERS = {}; // 各頁 render 函式於下方各區塊註冊

// 2026-08-11 使用者決策：班會紀錄／導生活動紀錄**整條流程暫不啟用**，所以 admin 與學諮主責
// 的畫面把相關頁籤全部收起（上傳、我的上傳、核章匣、班級統計、全校總表），只留導師資料與
// 後台管理。導師／系主任／學生端不受影響——他們的頁籤照舊。
// **要重啟只要把這個常數改成 true**，五個頁籤的原本條件都原封不動留在 NAV_PAGES 裡。
// 注意這只是前端閘門：紀錄相關的 action 在後端一個都沒關，直接打 API 照樣能用（刻意如此，
// 之後重啟不必動後端；真的要封鎖得在 doPost 各 action 內加判斷）。
const RECORD_FLOW_ENABLED_FOR_STAFF_ = false;
function recordFlowVisible_(roles) {
  if (RECORD_FLOW_ENABLED_FOR_STAFF_) return true;
  return !roles.isAdmin && !roles.isStaffLead;
}

// 登入後的第一頁。GAS 軌＝「導師名冊」平台，第一眼就該是導師資料；
// 落在「班會紀錄上傳」不只是不對題，對只有系辦助理身分的人更是一個導覽列上根本沒有的頁面
// （navPagesForRoles 已把其餘頁籤收掉），等於一進來就看到自己點不回去的畫面。
// 自架站是完整的導師資訊系統，維持原本的「上傳」。
function defaultPageId() {
  const roles = (bootstrapData && bootstrapData.roles) || {};
  if (!isSelfHosted()) {
    if ((roles.deptAssistantOf || []).length > 0 || roles.isAdmin) return 'deptroster';
  }
  // 「上傳」現在對 admin／主責是收起來的，落在那裡等於一進來就看到導覽列上沒有的頁面；
  // 拿不到就退回這個角色導覽列上的第一頁。
  const navs = navPagesForRoles(roles);
  if (navs.some(function (p) { return p.id === 'upload'; })) return 'upload';
  return navs.length ? navs[0].id : 'upload';
}

// 全校待確認導師建議總數（admin 後台導覽 badge 用）。
function pendingSuggestionCount() {
  return (bootstrapData.classes || []).reduce(function (n, c) {
    return n + ((c && c.suggestedTutors) ? c.suggestedTutors.length : 0);
  }, 0);
}

// GAS 軌上只有系辦助理身分的人（沒有導師/系主任/中心任何角色）只需要「導師資料」一頁——
// 班會紀錄那套跑在校內自架站，在這裡給他們「上傳/我的上傳」只會造成誤會。
// admin 與其他角色不受影響，仍看得到全部頁籤。
function navPagesForRoles(roles) {
  const onlyDeptAssistant = !isSelfHosted() && roles &&
    (roles.deptAssistantOf || []).length > 0 &&
    !roles.isAdmin && !roles.isDirector && !roles.isStaffLead && !roles.isStaffAssistant &&
    (roles.deptHeadOf || []).length === 0 && (roles.tutorOf || []).length === 0;
  return NAV_PAGES.filter(function (p) {
    if (onlyDeptAssistant && p.id !== 'deptroster') return false;
    return p.show(roles);
  });
}

function renderNav() {
  const roles = bootstrapData.roles;
  applyTrackBranding();
  $('main-nav').innerHTML = navPagesForRoles(roles)
    .map(function (p) {
      let label = p.label;
      // 後台管理頁籤旁顯示待確認導師建議數 badge（admin 才看得到此頁籤）
      if (p.id === 'admin') {
        const n = pendingSuggestionCount();
        if (n > 0) label += '<span class="nav-badge">' + n + '</span>';
      }
      return '<button class="nav-btn' + (p.id === currentPage ? ' active' : '') + '" data-page="' + p.id + '">' + label + '</button>';
    })
    .join('');
}
$('main-nav').addEventListener('click', function (e) {
  const btn = e.target.closest('.nav-btn');
  if (btn) showPage(btn.dataset.page);
});

function showPage(id) {
  currentPage = id;
  document.querySelectorAll('.nav-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.page === id); });
  const renderer = PAGE_RENDERERS[id];
  if (renderer) renderer(); else $('page-root').innerHTML = '<div class="empty-hint">找不到頁面</div>';
}

// ══════════════════════════════════════════════════════════════════════════════
// ── 資料查找小工具 ───────────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════════════
function deptById(id) { return (bootstrapData.departments || []).find(function (d) { return d.id === id; }); }
function classById(id) { return (bootstrapData.classes || []).find(function (c) { return c.id === id; }); }
function semesterById(id) { return (bootstrapData.semesters || []).find(function (s) { return s.id === id; }); }
function deptName(id) { const d = deptById(id); return d ? d.name : id; }
function collegeById(id) { return (bootstrapData.colleges || []).find(function (c) { return c.id === id; }); }
function tutorSystemById(id) { return (bootstrapData.tutorSystems || []).find(function (s) { return s.id === id; }); }
// 班級呈現一律用 displayName（無則 fallback name），比照既有慣例（fuseClassDisplayName_ 的
// 建議值由 classResolve/adminImportRoster 自動填，admin 可事後改）。
function className(id) { const c = classById(id); return c ? (c.displayName || c.name) : id; }
// 軟刪除（deleted:true）過濾（見 Ticket B）：deptById/classById/collegeById/tutorSystemById 等
// 「以 id 找名稱」的查找函式故意不過濾——已刪除項目的名稱仍要能在歷史紀錄/統計頁正確顯示；
// 只有「選單/chips/下拉」這類會讓使用者選取新項目的地方才套用 notDeleted 過濾。
function notDeleted(x) { return !x || x.deleted !== true; }
function activeDepartments() { return (bootstrapData.departments || []).filter(function (d) { return d.active !== false && notDeleted(d); }); }
function activeClasses() { return (bootstrapData.classes || []).filter(function (c) { return c.active !== false && notDeleted(c); }); }
function classesInDept(deptId) { return activeClasses().filter(function (c) { return c.deptId === deptId; }); }

async function uploadFilesForClass(semester, classId, files, onProgress) {
  const uploaded = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (onProgress) onProgress(i + 1, files.length, f.name);
    const base64Data = await fileToBase64(f);
    const res = await proxyCall('uploadAttachment', {
      semester: semester, classId: classId, fileName: f.name,
      mimeType: f.type || 'application/octet-stream', base64Data: base64Data,
    });
    uploaded.push({ fileId: res.fileId, fileName: res.fileName });
  }
  return uploaded;
}

async function triggerDownload(semester, recordId, fileId, fallbackName) {
  try {
    showLoading('下載附件中…');
    const res = await proxyCall('downloadAttachment', { semester: semester, recordId: recordId, fileId: fileId });
    const blob = base64ToBlob(res.base64, res.mimeType);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = res.fileName || fallbackName || 'attachment';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  } catch (e) {
    showToast('下載失敗：' + e.message, 'error');
  } finally {
    hideLoading();
  }
}

function attachmentListHtml(attachments, semester, recordId) {
  const list = attachments || [];
  if (!list.length) return '<p class="field-hint">（無附件）</p>';
  return '<ul class="attachment-list">' + list.map(function (a) {
    return '<li>📎 ' + escapeHtml(a.fileName || a.fileId) +
      ' <button type="button" class="btn btn-sm" data-action="download-attachment" data-semester="' + escapeHtml(semester) +
      '" data-record="' + escapeHtml(recordId) + '" data-file="' + escapeHtml(a.fileId) +
      '" data-name="' + escapeHtml(a.fileName || '') + '">下載</button></li>';
  }).join('') + '</ul>';
}

document.body.addEventListener('click', function (e) {
  const btn = e.target.closest('[data-action="download-attachment"]');
  if (!btn) return;
  triggerDownload(btn.dataset.semester, btn.dataset.record, btn.dataset.file, btn.dataset.name);
});

// 班會紀錄（meeting）的六個選填段落：鍵名 → [標題, placeholder]。
const MEETING_SECTIONS = [
  ['chairReport', '主席報告', '票選或推舉班會主席'],
  ['discussion',  '討論事項', ''],
  ['resolutions', '決議事項', ''],
  ['tutorRemarks', '導師的話', ''],
  ['extempore',   '臨時動議', ''],
  ['others',      '其他', '含教官至班級交通安全宣導等'],
];

// meeting 欄位：date/topic/chair/recorder/attendance 必填 + 六段選填；
// activity 欄位：date/topic/summary/attendance 必填（維持原版）。
function recordFormFieldsHtml(type, form, idPrefix) {
  form = form || {};
  const dateTopic = '<div class="row">' +
      '<div class="field"><label>日期</label><input type="date" id="' + idPrefix + 'date" value="' + escapeHtml(form.date || '') + '" required></div>' +
      '<div class="field"><label>主題</label><input type="text" id="' + idPrefix + 'topic" value="' + escapeHtml(form.topic || '') + '" required></div>' +
    '</div>';
  if (type === 'activity') {
    return dateTopic +
      '<div class="field"><label>內容摘要</label><textarea id="' + idPrefix + 'summary" required>' + escapeHtml(form.summary || '') + '</textarea></div>' +
      '<div class="field"><label>出席狀況</label><textarea id="' + idPrefix + 'attendance" required>' + escapeHtml(form.attendance || '') + '</textarea></div>';
  }
  return dateTopic +
    '<div class="row">' +
      '<div class="field"><label>主席</label><input type="text" id="' + idPrefix + 'chair" value="' + escapeHtml(form.chair || '') + '" required></div>' +
      '<div class="field"><label>紀錄</label><input type="text" id="' + idPrefix + 'recorder" value="' + escapeHtml(form.recorder || '') + '" required></div>' +
    '</div>' +
    '<div class="field"><label>出席狀況</label><textarea id="' + idPrefix + 'attendance" required>' + escapeHtml(form.attendance || '') + '</textarea></div>' +
    MEETING_SECTIONS.map(function (s) {
      return '<div class="field"><label>' + s[1] + '（選填）</label>' +
        '<textarea id="' + idPrefix + s[0] + '"' + (s[2] ? ' placeholder="' + escapeHtml(s[2]) + '"' : '') + '>' + escapeHtml(form[s[0]] || '') + '</textarea></div>';
    }).join('');
}

function readRecordFormFields(type, idPrefix) {
  const form = {
    date: $(idPrefix + 'date').value.trim(),
    topic: $(idPrefix + 'topic').value.trim(),
    attendance: $(idPrefix + 'attendance').value.trim(),
  };
  if (type === 'activity') {
    form.summary = $(idPrefix + 'summary').value.trim();
  } else {
    form.chair = $(idPrefix + 'chair').value.trim();
    form.recorder = $(idPrefix + 'recorder').value.trim();
    MEETING_SECTIONS.forEach(function (s) { form[s[0]] = $(idPrefix + s[0]).value.trim(); });
  }
  return form;
}

function validateRecordForm(type, form) {
  if (type === 'activity') {
    if (!form.date || !form.topic || !form.summary || !form.attendance) return '請完整填寫日期、主題、內容摘要、出席狀況。';
    return null;
  }
  if (!form.date || !form.topic || !form.chair || !form.recorder || !form.attendance) return '請完整填寫日期、主題、主席、紀錄、出席狀況。';
  return null;
}

// ══════════════════════════════════════════════════════════════════════════════
// ── 頁面 1：上傳頁 ────────────────────────────────────────────────────────────
// 班級 = (系所, 班級名稱) 組合，名稱自由文字（如「資管三A」「碩一」），第一次使用時
// 由後端 classResolve 自動建立；學生自填導師只作為「建議」（suggestedTutors），
// 待管理員後台確認才轉正式導師。
// action 呼叫點：classResolve → classStats（選定班級後顯示統計）→（逐檔）uploadAttachment → recordSubmit
// ══════════════════════════════════════════════════════════════════════════════
let upDeptSel = null;    // { deptId, name } 選既有；{ deptName } 自填新系所
let upClassSel = null;   // { classId, name } 選既有；{ className } 自填新班級
let upSuggested = [];    // 自填導師暫存 [{name,email}]，送出時隨 classResolve 的 suggestedTutors 送出
let upStatsToken = 0;    // classStats 非同步查詢競態守門（快速切換班級時只認最後一次）
let upDeptPicker = null, upClassPicker = null;

// 可重用的「搜尋框 + chips + 無命中建立」選取器（系所/班級共用）。
// cfg: { searchId, chipsId, getItems():[{id,name}], isSelected(item), getCustomName(),
//        createText(kw), validateNew(kw)→errMsg|null, onPick(item), onCreate(kw) }
function setupChipPicker(cfg) {
  function render() {
    const searchEl = $(cfg.searchId);
    if (!searchEl || !$(cfg.chipsId)) return;
    const kw = searchEl.value.trim();
    const items = cfg.getItems().filter(function (it) { return !kw || String(it.name || '').indexOf(kw) !== -1; });
    let html = items.map(function (it) {
      return '<button type="button" class="chip' + (cfg.isSelected(it) ? ' active' : '') + '" data-pick="' + escapeHtml(it.id) + '">' + escapeHtml(it.name) + '</button>';
    }).join('');
    // 已選的「自填新項目」以 active 虛線 chip 顯示
    const customName = cfg.getCustomName();
    if (customName) html += '<button type="button" class="chip chip-new active" data-pick="__custom">' + escapeHtml(customName) + '（新）</button>';
    // 關鍵字無命中 → 顯示「建立新XX『kw』」按鈕（即自填）
    if (kw && !items.length && kw !== customName) {
      html += '<button type="button" class="chip chip-new" data-create="' + escapeHtml(kw) + '">' + escapeHtml(cfg.createText(kw)) + '</button>';
    }
    if (!html) html = '<span class="field-hint">輸入關鍵字搜尋，找不到時可直接建立。</span>';
    $(cfg.chipsId).innerHTML = html;
  }
  $(cfg.searchId).addEventListener('input', render);
  $(cfg.chipsId).addEventListener('click', function (e) {
    const pickBtn = e.target.closest('[data-pick]');
    if (pickBtn) {
      if (pickBtn.dataset.pick === '__custom') return; // 已選中的自填項目，點擊無動作
      const item = cfg.getItems().filter(function (it) { return it.id === pickBtn.dataset.pick; })[0];
      if (item) cfg.onPick(item);
      return;
    }
    const createBtn = e.target.closest('[data-create]');
    if (createBtn) {
      const name = createBtn.dataset.create;
      const err = cfg.validateNew(name);
      if (err) { showToast(err, 'error'); return; }
      cfg.onCreate(name);
    }
  });
  render();
  return { render: render };
}

          '<option value="meeting">班會紀錄</option><option value="activity">導生活動紀錄</option>' +
        '</select></div>' +
        '<div class="field"><label>系所</label>' +
          '<input type="text" id="up-dept-search" placeholder="輸入關鍵字搜尋系所；找不到可直接建立" maxlength="30" style="max-width:300px; margin-bottom:8px;">' +
          '<div id="up-dept-chips" class="chips"></div>' +
        '</div>' +
        '<div class="field" id="up-class-block" style="display:none;"><label>班級</label>' +
          '<input type="text" id="up-class-search" placeholder="輸入關鍵字搜尋班級（如：資管三A）；找不到可直接建立" maxlength="20" style="max-width:300px; margin-bottom:8px;">' +
          '<div id="up-class-chips" class="chips"></div>' +
        '</div>' +
        '<div id="up-class-info"></div>' +
        '<div id="up-form-fields"></div>' +

          '<div class="field"><label>上傳者姓名</label><input type="text" id="up-name" required></div>' +
          '<div class="field"><label>學號</label><input type="text" id="up-sid" required></div>' +

    getCustomName: function () { return (upDeptSel && upDeptSel.deptName) || ''; },
    createText: function (kw) { return '＋ 建立新系所「' + kw + '」'; },
    validateNew: function (kw) { return DEPT_NAME_RE.test(kw) ? null : '系所名稱限 1–30 字（中英數字/括號/空白）'; },
    onPick: function (it) { upDeptSel = { deptId: it.id, name: it.name }; onUpDeptChanged(); },

  upClassPicker = setupChipPicker({

    getItems: function () { return (upDeptSel && upDeptSel.deptId) ? classesInDept(upDeptSel.deptId) : []; },
    isSelected: function (it) { return !!(upClassSel && upClassSel.classId === it.id); },
    getCustomName: function () { return (upClassSel && upClassSel.className) || ''; },
    createText: function (kw) { return '＋ 建立新班級「' + kw + '」'; },
    validateNew: function (kw) { return CLASS_NAME_RE.test(kw) ? null : '班級名稱限 1–20 字（中英數字，不可含空白/符號）'; },
    onPick: function (it) { upClassSel = { classId: it.id, name: it.name }; onUpClassChanged(); },
    onCreate: function (kw) { upClassSel = { className: kw }; onUpClassChanged(); },
  });

function renderUpFormFields() {
  $('up-form-fields').innerHTML = recordFormFieldsHtml($('up-type').value, {}, 'up-');
  applyChairDefault();
}

// 主席欄預設帶入所選班級第一位正式導師姓名（可改）：只在欄位為空或仍是上次自動值時覆寫，
// 避免蓋掉使用者手動輸入。
function applyChairDefault() {
  const el = $('up-chair');
  if (!el) return;
  const cls = (upClassSel && upClassSel.classId) ? classById(upClassSel.classId) : null;
  const first = (cls && cls.tutors && cls.tutors[0] && cls.tutors[0].name) || '';
  if (first && (!el.value || el.value === el.dataset.autoDefault)) {
    el.value = first;
    el.dataset.autoDefault = first;
  }
}

function onUpDeptChanged() {
  upClassSel = null;
  upSuggested = [];
  $('up-class-block').style.display = '';
  $('up-class-search').value = '';
  upDeptPicker.render();
  upClassPicker.render();
  renderUpClassInfo();
  applyChairDefault();
}

function onUpClassChanged() {
  upSuggested = [];
  upClassPicker.render();
  renderUpClassInfo();
  applyChairDefault();
}

// 選定班級後的資訊區：繳交統計提示（classStats）+ 導師 chips（正式/待確認/自填）。
async function renderUpClassInfo() {
  const el = $('up-class-info');
  if (!el) return;
  if (!upClassSel) { el.innerHTML = ''; return; }

  const cls = upClassSel.classId ? classById(upClassSel.classId) : null;
  const official = (cls && cls.tutors) || [];
  const serverSug = (cls && cls.suggestedTutors) || [];

  const tutorChips =
    official.map(function (t) {
      return '<span class="chip chip-official chip-static">' + escapeHtml(t.name) + '</span>';
    }).join('') +
    serverSug.map(function (s) {
      return '<span class="chip chip-suggested chip-static">' + escapeHtml(s.name) + '（待確認）</span>';
    }).join('') +
    upSuggested.map(function (t, i) {
      return '<span class="chip chip-suggested chip-static">' + escapeHtml(t.name) + '（待確認）' +
        '<button type="button" class="chip-x" data-sug-del="' + i + '" title="移除">×</button></span>';
    }).join('');

  el.innerHTML =
    '<div class="card" style="background:var(--color-bg);">' +
      '<div id="up-class-stats" class="field-hint" style="margin-bottom:10px;">' +
        (upClassSel.classId ? '查詢本班繳交統計中…' : '新班級：本學期尚無任何紀錄。') + '</div>' +
      '<div class="field" style="margin-bottom:8px;"><label>導師</label>' +
        '<div class="chips" id="up-tutor-chips">' + (tutorChips || '<span class="field-hint">尚無導師資料，可於下方自填。</span>') + '</div>' +
      '</div>' +
      '<div class="row">' +
        '<div class="field"><label>＋自填導師姓名</label><input type="text" id="up-tutor-name" maxlength="20"></div>' +
        '<div class="field"><label>導師 Email（選填）</label><input type="text" id="up-tutor-email"></div>' +
        '<div class="field" style="flex:0 0 auto;"><label>&nbsp;</label><button type="button" class="btn" id="up-tutor-add">加入</button></div>' +
      '</div>' +
      '<p class="field-hint">自填導師需管理員確認後才具核章身分。</p>' +
    '</div>';

  $('up-tutor-add').addEventListener('click', addSuggestedTutor);
  $('up-tutor-chips').addEventListener('click', function (e) {
    const del = e.target.closest('[data-sug-del]');
    if (del) { upSuggested.splice(Number(del.dataset.sugDel), 1); renderUpClassInfo(); }
  });

  // 統計提示（既有班級才查；新班顯示 0）。競態守門：只認最後一次查詢的結果。
  if (upClassSel.classId) {
    const token = ++upStatsToken;
    try {
      const s = await proxyCall('classStats', { semester: bootstrapData.semester, classId: upClassSel.classId });
      if (token !== upStatsToken || !$('up-class-stats')) return;
      $('up-class-stats').textContent =
        '本班本學期已有 ' + s.meeting.total + ' 份班會紀錄（' + s.meeting.approved + ' 份通過、' + s.meeting.pending + ' 份審核中）；' +
        '導生活動 ' + s.activity.total + ' 份（' + s.activity.approved + ' 份通過、' + s.activity.pending + ' 份審核中）。';
    } catch (e2) {
      if (token === upStatsToken && $('up-class-stats')) $('up-class-stats').textContent = '（繳交統計查詢失敗：' + e2.message + '）';
    }
  }
}

function addSuggestedTutor() {
  const name = $('up-tutor-name').value.trim();
  const email = $('up-tutor-email').value.trim().toLowerCase();
  if (!TUTOR_NAME_RE.test(name)) { showToast('導師姓名限 1–20 字（中英數字/間隔號/空白）', 'error'); return; }
  if (email && !EMAIL_RE.test(email)) { showToast('導師 Email 格式不正確', 'error'); return; }
  if (upSuggested.length >= 2) { showToast('一次最多自填 2 位導師', 'error'); return; }
  if (upSuggested.some(function (t) { return t.name === name; })) { showToast('已加入同名導師', 'error'); return; }
  upSuggested.push({ name: name, email: email });
  renderUpClassInfo();
}

async function onUploadSubmit(e) {
  e.preventDefault();
  const type = $('up-type').value;

  if (!upDeptSel) { showToast('請選擇系所', 'error'); return; }
  if (!upClassSel) { showToast('請選擇班級', 'error'); return; }

  // classResolve 參數：deptId（既有）或 deptName（自填）二擇一 + className。
  const resolveParams = {};
  if (upDeptSel.deptId) resolveParams.deptId = upDeptSel.deptId;
  else resolveParams.deptName = upDeptSel.deptName;
  const className = upClassSel.classId ? upClassSel.name : upClassSel.className;
  if (!CLASS_NAME_RE.test(String(className || '').trim())) { showToast('班級名稱限 1–20 字（中英數字，不可含空白/符號）', 'error'); return; }
  resolveParams.className = className;
  if (upSuggested.length) resolveParams.suggestedTutors = upSuggested;

  const form = readRecordFormFields(type, 'up-');
  const invalid = validateRecordForm(type, form);
  if (invalid) { showToast(invalid, 'error'); return; }
  const name = $('up-name').value.trim();
  const sid = $('up-sid').value.trim();
  if (!name || !sid) { showToast('請填寫上傳者姓名與學號', 'error'); return; }
  const files = Array.from($('up-files').files || []);
  const semester = bootstrapData.semester;
  const submitBtn = e.target.querySelector('button[type=submit]');
  try {
    await withBtnPending(submitBtn, async function () {
      // 1) classResolve：find-or-create 系所/班級（含導師建議），拿 classId；用回傳同步本地清單。
      $('up-progress').textContent = '確認班級中…';
      const resolved = await proxyCall('classResolve', resolveParams);
      bootstrapData.departments = resolved.departments;
      bootstrapData.classes = resolved.classes;
      if (resolved.suggestionsDropped > 0) showToast('部分導師建議未收錄（該班建議數已達上限）', 'info');
      const classId = resolved.classId;

      // 2) 逐檔上傳附件（須在 recordSubmit 之前，後端 submit 時驗證附件歸屬資料夾）。
      let attachments = [];
      if (files.length) {
        attachments = await uploadFilesForClass(semester, classId, files, function (i, total, fname) {
          $('up-progress').textContent = '上傳附件中… (' + i + '/' + total + ') ' + fname;
        });
      }
      $('up-progress').textContent = '';

      // 3) 建立紀錄。
      await proxyCall('recordSubmit', {
        semester: semester, classId: classId, type: type,
        form: form, attachments: attachments,
        uploader: { name: name, studentId: sid },
      });
      showToast('已送出，等待核章', 'success');
      await refreshBootstrap();
      showPage('mine');
    });
  } catch (err) {
    $('up-progress').textContent = '';
    showToast('送出失敗：' + err.message, 'error');
  }
}

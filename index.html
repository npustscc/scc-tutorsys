      '<div class="field" style="max-width:220px;"><label>學期</label><select id="mine-semester">' +
        (bootstrapData.semesters || []).map(function (s) { return '<option value="' + escapeHtml(s.id) + '"' + (s.id === mineSemester ? ' selected' : '') + '>' + escapeHtml(s.label || s.id) + '</option>'; }).join('') +
      '</select></div>' +
      '<div id="mine-list" class="table-wrap"><div class="empty-hint">載入中…</div></div>' +
    '</div>';

  $('mine-semester').addEventListener('change', function () {
    mineSemester = $('mine-semester').value;
    loadMineList();
  });

  await loadMineList();
};

let mineTutorClassRecords = [];

async function loadMineList() {
  const sem = mineSemester;
  await loadPageData({
    action: 'recordGetMine', params: { semester: sem },
    slot: 'mine-list',
    valid: function () { return mineSemester === sem; },
    render: function (res) {
      mineRecords = res.records || [];
      mineTutorClassRecords = res.tutorClassRecords || [];
      renderMineList();
    },
  });
}

function renderMineList() {
  if (!mineRecords.length) { $('mine-list').innerHTML = '<div class="empty-hint">這個學期還沒有上傳紀錄。</div>'; return; }
  $('mine-list').innerHTML =
    '<table><thead><tr><th>類型</th><th>系所／班級</th><th>日期</th><th>主題</th><th>狀態</th><th>操作</th></tr></thead><tbody>' +
    mineRecords.map(function (r) {
      const badge = '<span class="badge badge-' + r.status + '">' + STATUS_LABELS[r.status] + '</span>';
      const rejectNote = r.status === 'rejected' && r.rejection ? '<div class="field-hint">退件理由：' + escapeHtml(r.rejection.reason) + '</div>' : '';
      return '<tr>' +
        '<td data-label="類型"><span class="badge badge-type">' + TYPE_LABELS[r.type] + '</span></td>' +
        '<td data-label="系所／班級">' + escapeHtml(deptName(r.deptId)) + ' / ' + escapeHtml(className(r.classId)) + '</td>' +
        '<td data-label="日期">' + escapeHtml(r.form && r.form.date || '') + '</td>' +
        '<td data-label="主題">' + escapeHtml(r.form && r.form.topic || '') + '</td>' +
        '<td data-label="狀態">' + badge + rejectNote + '</td>' +
        '<td data-label="操作">' +
          '<button class="btn btn-sm" data-action="mine-view" data-id="' + escapeHtml(r.id) + '">檢視</button> ' +
          // 退件重送一律限本班導師（見 dev/Code.gs canResubmit_ 註解），非導師的原上傳者看不到此按鈕，
          // 只能請導師到「導師個人後台」重送。
          (r.status === 'rejected' && bootstrapData.roles.tutorOf.indexOf(r.classId) !== -1
            ? '<button class="btn btn-sm btn-primary" data-action="mine-resubmit" data-id="' + escapeHtml(r.id) + '">重新送出</button>'
            : (r.status === 'rejected' ? '<span class="field-hint">請導師修正重送</span>' : '')) +
        '</td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
}

function findMineRecord(id) { return mineRecords.find(function (r) { return r.id === id; }); }

document.body.addEventListener('click', function (e) {
  const viewBtn = e.target.closest('[data-action="mine-view"]');
  if (viewBtn) { openRecordViewModal(findMineRecord(viewBtn.dataset.id)); return; }
  const resubmitBtn = e.target.closest('[data-action="mine-resubmit"]');
  if (resubmitBtn) { openResubmitModal(findMineRecord(resubmitBtn.dataset.id)); return; }
});

function recordDetailHtml(r) {
  const f = r.form || {};
  function multiline(v) { return v ? escapeHtml(v).replace(/\n/g, '<br>') : '（無）'; }
  let body;
  if (r.type === 'meeting') {
    body = '<p><b>主席：</b>' + escapeHtml(f.chair || '') + '　<b>紀錄：</b>' + escapeHtml(f.recorder || '') + '</p>' +
      '<p><b>出席狀況：</b><br>' + multiline(f.attendance) + '</p>' +
      MEETING_SECTIONS.map(function (s) { return '<p><b>' + s[1] + '：</b><br>' + multiline(f[s[0]]) + '</p>'; }).join('');
  } else {
    body = '<p><b>內容摘要：</b><br>' + multiline(f.summary) + '</p>' +
      '<p><b>出席狀況：</b><br>' + multiline(f.attendance) + '</p>';
  }
  return '<p><b>類型：</b>' + TYPE_LABELS[r.type] + '　<b>班級：</b>' + escapeHtml(deptName(r.deptId)) + ' / ' + escapeHtml(className(r.classId)) + '</p>' +
    '<p><b>日期：</b>' + escapeHtml(f.date) + '　<b>主題：</b>' + escapeHtml(f.topic) + '</p>' +
    body +
    '<p><b>上傳者：</b>' + escapeHtml(r.uploader.name) + '（' + escapeHtml(r.uploader.studentId) + '，' + escapeHtml(r.uploader.email) + '）</p>' +
    approvalProgressHtml(r) +
    (r.topics ? topicsSummaryHtml(r.topics) : '') +
    '<p><b>附件：</b></p>' + attachmentListHtml(r.attachments, r.semester, r.id) +
    (r.status === 'rejected' && r.rejection ? '<p style="color:var(--color-danger);"><b>退件理由（' + (STAGE_LABELS[r.rejection.role] || r.rejection.role) + '）：</b>' + escapeHtml(r.rejection.reason) + '</p>' : '');
}

// 核章進度條：依該紀錄類型的核章鏈（meeting 4 關／activity 2 關）逐關顯示狀態
// （已核章／目前待核／尚未輪到），核章者姓名（actualBy 已由後端 sanitize，非授權角色看不到）。
function approvalProgressHtml(r) {
  const chain = APPROVAL_CHAIN[r.type] || APPROVAL_CHAIN.meeting;
  const curStage = (r.status || '').indexOf('pending_') === 0 ? r.status.slice('pending_'.length) : null;
  const curIdx = curStage ? chain.indexOf(curStage) : (r.status === 'approved' ? chain.length : -1);
  const items = chain.map(function (stage, i) {
    let who = '';
    if (stage === 'tutor') {
      who = (r.approvals && r.approvals.tutor || []).map(function (t) { return t.name; }).filter(Boolean).join('、');
    } else if (r.approvals && r.approvals[stage]) {
      who = r.approvals[stage].name || '';
    }
    const done = r.status === 'approved' || (curIdx !== -1 && i < curIdx);
    const active = i === curIdx && r.status !== 'approved' && r.status !== 'rejected';
    const cls = done ? 'badge-approved' : (active ? 'badge-pending_tutor' : '');
    return '<span class="badge ' + cls + '" style="' + (cls ? '' : 'background:var(--color-bg); color:var(--color-muted);') + ' margin-right:6px;">' +
      escapeHtml(STAGE_LABELS[stage]) + (who ? '：' + escapeHtml(who) : '') + '</span>';
  }).join('');
  return '<p><b>核章進度：</b><br>' + items + '</p>';
}

function topicsSummaryHtml(topics) {
  const rules = bootstrapData.keywordRules || {};
  const checked = KEYWORD_TOPIC_KEYS.filter(function (k) { return topics[k] && topics[k].checked; });
  if (!checked.length) return '<p><b>四類宣導：</b>（無）</p>';
  return '<p><b>四類宣導：</b>' + checked.map(function (k) {
    return escapeHtml((rules[k] && rules[k].label) || k);
  }).join('、') + '</p>';
}

function openRecordViewModal(r) {
  if (!r) return;
  openModal(STATUS_LABELS[r.status] || '紀錄詳情', recordDetailHtml(r) + '<div class="modal-actions"><button class="btn" data-action="close-modal">關閉</button></div>', { wide: true });
}

function openResubmitModal(r, onDone) {
  if (!r) return;
  const bodyHtml =
    '<form id="resubmit-form">' +
      recordFormFieldsHtml(r.type, r.form, 're-') +
      '<div class="field"><label>既有附件</label>' + attachmentListHtml(r.attachments, r.semester, r.id) + '</div>' +
      '<div class="field"><label>新增附件（可複選，會加到既有附件之後）</label><input type="file" id="re-files" multiple accept="image/*,.pdf,.doc,.docx" /></div>' +
      '<div id="re-progress" class="field-hint"></div>' +
      '<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">取消</button><button type="submit" class="btn btn-primary">重新送出</button></div>' +
    '</form>';
  openModal('退件重送', bodyHtml, { wide: true });
  $('resubmit-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const form = readRecordFormFields(r.type, 're-');
    const invalid = validateRecordForm(r.type, form);
    if (invalid) { showToast(invalid, 'error'); return; }
    const files = Array.from($('re-files').files || []);
    const submitBtn = e.target.querySelector('button[type=submit]');
    try {
      await withBtnPending(submitBtn, async function () {
        let attachments = r.attachments || [];
        if (files.length) {
          const newOnes = await uploadFilesForClass(r.semester, r.classId, files, function (i, total, fname) {
            $('re-progress').textContent = '上傳附件中… (' + i + '/' + total + ') ' + fname;
          });
          attachments = attachments.concat(newOnes);
        }
        await proxyCall('recordResubmit', {
          semester: r.semester, recordId: r.id, form: form, attachments: attachments,
          uploaderName: r.uploader.name,
        });
        showToast('已重新送出，等待核章', 'success');
        closeModal();
        if (onDone) await onDone(); else await loadMineList();
        await refreshBootstrap();
      });
    } catch (err) {
      showToast('重新送出失敗：' + err.message, 'error');
    }
  });
}

document.body.addEventListener('click', function (e) {
  if (e.target.closest('[data-action="close-modal"]')) closeModal();
});

function myActionableRecords() {
  const roles = bootstrapData.roles;
  return (bootstrapData.records || []).filter(function (r) {
    if (r.status === 'pending_tutor') {
      if (roles.isAdmin) return true;
      const cls = classById(r.classId);
      if (!cls || roles.tutorOf.indexOf(cls.id) === -1) return false;
      const already = (r.approvals.tutor || []).some(function (t) { return t.email === currentUser.email; });
      return !already;
    }
    if (r.status === 'pending_dept') {
      if (roles.isAdmin) return true;
      const dept = deptById(r.deptId);
      return !!dept && roles.deptHeadOf.indexOf(dept.id) !== -1;
    }
    if (r.status === 'pending_staffLead') {
      return roles.isAdmin || roles.isStaffLead || (roles.isStaffAssistant && !!roles.assistantLead);
    }
    if (r.status === 'pending_director') return roles.isAdmin || roles.isDirector;
    return false;
  });
}

function findQueueRecord(id) { return (bootstrapData.records || []).find(function (r) { return r.id === id; }); }

// 只有 staffLead 關的驗證者（主責/已綁定助理）與 director/admin 能手動調整四類宣導勾選
// （比照後端 canSetTopics_）；純前端 UI 閘門，後端 recordSetTopicsAction_ 才是安全邊界。
function canSetTopicsClient() {
  const roles = bootstrapData.roles;
  return !!(roles && (roles.isAdmin || roles.isDirector || roles.isStaffLead || roles.isStaffAssistant));
}

function topicsCheckboxesHtml(topics, idPrefix) {
  const rules = bootstrapData.keywordRules || {};
  return '<div class="field"><label>四類宣導勾選（已依關鍵字自動偵測；手動調整後不再被自動掃描覆蓋）</label><div>' +
    KEYWORD_TOPIC_KEYS.map(function (key) {
      const t = (topics && topics[key]) || { checked: false, auto: true };
      const label = (rules[key] && rules[key].label) || key;
      return '<label style="display:inline-flex; align-items:center; gap:6px; margin:4px 14px 4px 0;">' +
        '<input type="checkbox" id="' + idPrefix + key + '" ' + (t.checked ? 'checked' : '') + '>' +
        escapeHtml(label) + (t.auto === false ? ' <span class="field-hint">（已鎖定）</span>' : '') +
      '</label>';
    }).join('') + '</div></div>';
}

// 只回傳真的被手動改動的項目（與原始 topics.checked 不同才算），沒有變動回 null（不呼叫 recordSetTopics）。
function collectTopicsPatch(topics, idPrefix) {
  const patch = {};
  let changed = false;
  KEYWORD_TOPIC_KEYS.forEach(function (key) {
    const el = $(idPrefix + key);
    if (!el) return;
    const checked = el.checked;
    const orig = !!(topics && topics[key] && topics[key].checked);
    if (checked !== orig) { patch[key] = { checked: checked }; changed = true; }
  });
  return changed ? patch : null;
}

// 核章關「編輯內容」：核准/退件時可選填修改表單內容（後端白名單過濾 + editLog，見 dev/Code.gs
// applyFormEdit_）。核准照常推進，不重跑已過關卡；退件維持原本「一律退回導師」語意。
function editableContentHtml(r, idPrefix) {
  return '<details style="margin:6px 0 14px;"><summary style="cursor:pointer; font-weight:600; font-size:.88rem;">編輯內容（選填）</summary>' +
    '<div style="margin-top:10px;">' + recordFormFieldsHtml(r.type, r.form, idPrefix) + '</div>' +
  '</details>';
}

document.body.addEventListener('click', async function (e) {
  const viewBtn = e.target.closest('[data-action="queue-view"]');
  if (viewBtn) { openRecordViewModal(findQueueRecord(viewBtn.dataset.id)); return; }

  const approveBtn = e.target.closest('[data-action="queue-approve"]');
  if (approveBtn) { openApproveModal(findQueueRecord(approveBtn.dataset.id)); return; }

  const rejectBtn = e.target.closest('[data-action="queue-reject"]');
  if (rejectBtn) { openRejectModal(findQueueRecord(rejectBtn.dataset.id)); return; }
});

function openApproveModal(r) {
  if (!r) return;
  const showTopics = r.type === 'meeting' && r.topics && canSetTopicsClient();
  const bodyHtml =
    '<p class="field-hint">目前關卡：' + escapeHtml(STATUS_LABELS[r.status] || r.status) + '</p>' +
    editableContentHtml(r, 'apv-') +
    (showTopics ? topicsCheckboxesHtml(r.topics, 'apv-topic-') : '') +
    '<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">取消</button><button type="button" class="btn btn-success" id="approve-confirm-btn">確認核准</button></div>';
  openModal('核准紀錄', bodyHtml, { wide: true });

  $('approve-confirm-btn').addEventListener('click', async function () {
    const updatedForm = readRecordFormFields(r.type, 'apv-');
    const invalid = validateRecordForm(r.type, updatedForm);
    if (invalid) { showToast(invalid, 'error'); return; }
    const topicsPatch = showTopics ? collectTopicsPatch(r.topics, 'apv-topic-') : null;
    const btn = $('approve-confirm-btn');
    try {
      await withBtnPending(btn, async function () {
        await proxyCall('recordApprove', { semester: r.semester, recordId: r.id, updatedForm: updatedForm });
        if (topicsPatch) await proxyCall('recordSetTopics', { semester: r.semester, recordId: r.id, topics: topicsPatch });
        showToast('已核准', 'success');
        closeModal();
        await refreshBootstrap();
      });
    } catch (err) {
      showToast('核准失敗：' + err.message, 'error');
    }
  });
}

function openRejectModal(r) {
  if (!r) return;
  const bodyHtml =
    '<form id="reject-form">' +
      editableContentHtml(r, 'rej-') +
      '<div class="field"><label>退件理由（必填）</label><textarea id="reject-reason" required></textarea></div>' +
      '<p class="field-hint">退件一律退回導師修正重送，不論是哪一關退的。</p>' +
      '<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">取消</button><button type="submit" class="btn btn-danger">確認退件</button></div>' +
    '</form>';
  openModal('退件', bodyHtml, { wide: true });
  $('reject-form').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const reason = $('reject-reason').value.trim();
    if (!reason) { showToast('請填寫退件理由', 'error'); return; }
    const updatedForm = readRecordFormFields(r.type, 'rej-');
    const submitBtn = ev.target.querySelector('button[type=submit]');
    try {
      await withBtnPending(submitBtn, async function () {
        await proxyCall('recordReject', { semester: r.semester, recordId: r.id, reason: reason, updatedForm: updatedForm });
        showToast('已退件', 'success');
        closeModal();
        await refreshBootstrap();
      });
    } catch (err) { showToast('退件失敗：' + err.message, 'error'); }
  });
}

// ── 頁面 4：統計 ──────────────────────────────────────────────────────────────
// action 呼叫點：classSetWhitelist（導師設定本班上傳白名單）；統計數字直接彙整
// bootstrapData.records（已由後端 canViewRecord_ 依角色過濾可見範圍）。
// ══════════════════════════════════════════════════════════════════════════════
function visibleClassesForStats() {
  const roles = bootstrapData.roles;
  const classes = activeClasses();
  if (roles.isAdmin || roles.isDirector) return classes;
  return classes.filter(function (c) { return roles.deptHeadOf.indexOf(c.deptId) !== -1 || roles.tutorOf.indexOf(c.id) !== -1; });
}

function countsForClass(classId, type) {
  const recs = (bootstrapData.records || []).filter(function (r) { return r.classId === classId && r.type === type; });
  const approved = recs.filter(function (r) { return r.status === 'approved'; }).length;
  const pending = recs.filter(function (r) { return r.status && r.status.indexOf('pending') === 0; }).length;
  return { approved: approved, pending: pending };
}

PAGE_RENDERERS.stats = function renderStatsPage() {
  const roles = bootstrapData.roles;
  const sem = semesterById(bootstrapData.semester) || {};
  const quotaMeeting = sem.quotaMeeting || DEFAULT_QUOTA_MEETING;
  const quotaActivity = sem.quotaActivity || DEFAULT_QUOTA_ACTIVITY;
  const classes = visibleClassesForStats();

  const byDept = {};
  classes.forEach(function (c) { (byDept[c.deptId] = byDept[c.deptId] || []).push(c); });
  const deptIds = Object.keys(byDept).sort(function (a, b) { return deptName(a).localeCompare(deptName(b), 'zh-Hant'); });

  let rowsHtml = '';
  deptIds.forEach(function (deptId) {
    rowsHtml += '<tr class="dept-group-header"><td colspan="4">' + escapeHtml(deptName(deptId)) + '</td></tr>';
    byDept[deptId].forEach(function (c) {
      const m = countsForClass(c.id, 'meeting');
      const a = countsForClass(c.id, 'activity');
      const isTutor = roles.tutorOf.indexOf(c.id) !== -1;
      rowsHtml += '<tr>' +
        '<td data-label="班級">' + escapeHtml(c.name) + (isTutor ? ' <button class="btn btn-sm" data-action="edit-whitelist" data-id="' + escapeHtml(c.id) + '">設定上傳白名單</button>' : '') + '</td>' +
        '<td data-label="班會紀錄" class="qty">' + m.approved + ' / ' + quotaMeeting + (m.pending ? ' <span class="pending-note">(' + m.pending + ' 審核中)</span>' : '') + '</td>' +
        '<td data-label="導生活動紀錄" class="qty">' + a.approved + ' / ' + quotaActivity + (a.pending ? ' <span class="pending-note">(' + a.pending + ' 審核中)</span>' : '') + '</td>' +
        '<td data-label="雙導師模式">' + ((c.tutors || []).length >= 2 ? (c.dualApprovalMode === 'all' ? '需全部核章' : '任一核章') : '單導師') + '</td>' +
      '</tr>';
    });
  });

  $('page-root').innerHTML =
    '<div class="card">' +
      '<h2>繳交進度統計</h2>' +
      '<div class="field" style="max-width:220px;"><label>學期</label><select id="stats-semester">' +
        (bootstrapData.semesters || []).map(function (s) { return '<option value="' + escapeHtml(s.id) + '"' + (s.id === bootstrapData.semester ? ' selected' : '') + '>' + escapeHtml(s.label || s.id) + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="table-wrap"><table class="stats-matrix"><thead><tr><th>班級</th><th>班會紀錄</th><th>導生活動紀錄</th><th>導師模式</th></tr></thead><tbody>' +
      (rowsHtml || '<tr><td colspan="4" class="empty-hint">目前沒有可檢視的班級。</td></tr>') +
      '</tbody></table></div>' +
    '</div>';

  $('stats-semester').addEventListener('change', function () { refreshBootstrap($('stats-semester').value); });
};

document.body.addEventListener('click', function (e) {
  const btn = e.target.closest('[data-action="edit-whitelist"]');
  if (!btn) return;
  const c = classById(btn.dataset.id);
  if (!c) return;
  openModal('設定「' + c.name + '」上傳白名單', '<form id="whitelist-form">' +

    '<div class="field"><textarea id="wl-emails" rows="6">' + escapeHtml((c.uploadWhitelist || []).join('\n')) + '</textarea></div>' +
    '<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">取消</button><button type="submit" class="btn btn-primary">儲存</button></div>' +
  '</form>');

function renderOverviewTable(rows) {
  if (!rows.length) { $('overview-content').innerHTML = '<div class="empty-hint">目前沒有可檢視的班級。</div>'; return; }
  const rules = bootstrapData.keywordRules || {};
  const byCollege = {};
  rows.forEach(function (r) { const key = r.college || '（未分類）'; (byCollege[key] = byCollege[key] || []).push(r); });
  const collegeNames = Object.keys(byCollege).sort(function (a, b) { return a.localeCompare(b, 'zh-Hant'); });

  let html = '<div class="tab-bar">' + collegeNames.map(function (name, i) {
    return '<button class="tab-btn' + (i === 0 ? ' active' : '') + '" data-overview-college="' + escapeHtml(name) + '">' + escapeHtml(name) + '（' + byCollege[name].length + '）</button>';
  }).join('') + '</div>';

  collegeNames.forEach(function (name, i) {
    html += '<div class="table-wrap overview-college-panel" data-overview-panel="' + escapeHtml(name) + '" style="' + (i === 0 ? '' : 'display:none;') + '">' +
      '<table class="stats-matrix"><thead><tr><th>系所</th><th>班級</th><th>導師</th><th>應繳</th><th>已繳</th><th>已核准</th>' +
      KEYWORD_TOPIC_KEYS.map(function (k) { return '<th>' + escapeHtml((rules[k] && rules[k].label) || k) + '</th>'; }).join('') +
      '<th>導生活動</th></tr></thead><tbody>' +
      byCollege[name].slice().sort(function (a, b) { return (a.dept || '').localeCompare(b.dept || '', 'zh-Hant') || (a.displayName || '').localeCompare(b.displayName || '', 'zh-Hant'); }).map(function (r) {
        const notVerified = r.pendingCount > 0;
        return '<tr>' +
          '<td data-label="系所">' + escapeHtml(r.dept || '') + '</td>' +
          '<td data-label="班級">' + escapeHtml(r.displayName) + '</td>' +
          '<td data-label="導師">' + escapeHtml((r.tutors || []).join('、')) + '</td>' +
          '<td data-label="應繳" class="qty">' + (r.required === 0 ? '免繳' : r.required) + '</td>' +
          '<td data-label="已繳" class="qty">' + r.submittedCount + (notVerified ? ' <span class="pending-note">(尚未驗證)</span>' : '') + '</td>' +
          '<td data-label="已核准" class="qty">' + r.approvedCount + '</td>' +
          KEYWORD_TOPIC_KEYS.map(function (k) {
            const t = r.topics && r.topics[k];
            // 需求：除了打勾，還要顯示「是幾月幾號的班會紀錄」——dates 為命中該宣導的班會日期。
            const dates = (t && t.checked && t.dates && t.dates.length)
              ? '<div class="topic-dates">' + t.dates.map(function (d) { return escapeHtml(d); }).join('、') + '</div>' : '';
            return '<td data-label="' + escapeHtml((rules[k] && rules[k].label) || k) + '">' + (t && t.checked ? '✓' : '') + dates + '</td>';
          }).join('') +
          '<td data-label="導生活動">' + (r.activity && r.activity.submitted ? (r.activity.approved ? '已核准' : '已繳未驗證') : '未繳') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>';
  });

  $('overview-content').innerHTML = html;
}

// 學院顯示名：bootstrap 的 colleges 有這一筆就用它的 name。自架站的 store 目前沒有
// colleges.json（名冊 importer 不搬學院），這時 collegeId 本身就是學院名（例「農學院」），
// 直接顯示 id 即可——不要因為查不到名字就把整個學院篩選藏起來。
function deptRosterCollegeLabel(id) {
  if (!id) return '未分學院';
  const c = collegeById(id);
  return (c && c.name) || id;
}

function deptRosterDeptsInCollege(collegeId) {
  if (!collegeId) return deptRosterDepts.slice();
  return deptRosterDepts.filter(function (d) { return (d.collegeId || '') === collegeId; });
}

// 出現在學院選單的鍵：依後台 order 排，查不到 order 的（含「未分學院」）殿後。
function deptRosterCollegeKeys() {
  const keys = [];
  deptRosterDepts.forEach(function (d) {
    const k = d.collegeId || '';
    if (keys.indexOf(k) === -1) keys.push(k);
  });
  return keys.sort(function (a, b) {
    const ca = collegeById(a);
    const cb = collegeById(b);
    const oa = (ca && ca.order != null) ? ca.order : 9999;
    const ob = (cb && cb.order != null) ? cb.order : 9999;
    if (oa !== ob) return oa - ob;
    return deptRosterCollegeLabel(a).localeCompare(deptRosterCollegeLabel(b), 'zh-Hant');
  });
}

function renderDeptRosterFilters() {
  const colSel = $('deptroster-college');
  const sel = $('deptroster-dept');
  if (!colSel || !sel) return;
  const keys = deptRosterCollegeKeys();
  colSel.innerHTML =
    '<option value="">全部學院（' + deptRosterDepts.length + ' 系所）</option>' +
    keys.map(function (k) {
      return '<option value="' + escapeHtml(k) + '">' + escapeHtml(deptRosterCollegeLabel(k)) +
        '（' + deptRosterDeptsInCollege(k).length + '）</option>';
    }).join('');
  colSel.value = deptRosterCollegeId;
  const list = deptRosterDeptsInCollege(deptRosterCollegeId);
  sel.innerHTML = list.map(function (d) {
    return '<option value="' + escapeHtml(d.id) + '">' + escapeHtml(d.fullName || d.name || d.id) + '</option>';
  }).join('');
  if (deptRosterDeptId) sel.value = deptRosterDeptId;
  // 只管一個系所的助理沒有選擇餘地，整列收起來少一個干擾；只有一個學院時也不必露出學院選單。
  const row = $('deptroster-filters');
  if (row) row.style.display = deptRosterDepts.length > 1 ? '' : 'none';
  colSel.parentElement.style.display = keys.length > 1 ? '' : 'none';
}

async function loadDeptRoster(deptId) {
  // deptId 為 null＝不指定，後端回「我管的全部系所」；選單就是用這一趟的回傳建的。
  const want = deptId || null;
  await loadPageData({
    action: 'deptRosterGet', params: deptId ? { deptId: deptId } : {},
    slot: 'deptroster-content',
    valid: function () { return (deptRosterDeptId || null) === want || want === null; },
    render: function (res) {
      const depts = res.departments || [];
      // 只有「不帶 deptId」那趟拿得到我管的全部系所，用它更新篩選清單（同一次登入中匯入了
      // 新系所也會跟上）；帶了 deptId 的回傳只有那一系，拿它覆寫會讓選單縮到剩一個。
      if (!deptId && depts.length) {
        deptRosterDepts = depts;
        const stillThere = depts.some(function (d) { return d.id === deptRosterDeptId; });
        if (!stillThere) deptRosterDeptId = depts[0].id;
      }
      renderDeptRosterFilters();
      // 主任導師（＝系主任）是系所層級的一筆，跟著目前選到的系所走。
      const shownDeptId = deptId || deptRosterDeptId || null;
      const shownDept = depts.filter(function (d) { return d.id === shownDeptId; })[0] ||
        deptRosterDepts.filter(function (d) { return d.id === shownDeptId; })[0] || null;
      // 不帶 deptId 的那趟會一次回全部系所（含各自的 head），順手全部快取起來，
      // 切系所時就不必等下一趟回來才畫得出主任導師。
      depts.forEach(function (d) { if (d && d.head) deptRosterHeadCache[d.id] = d.head; });
      renderDeptRosterHead(shownDeptId);
      renderDeptRosterTable(res.classes || [], shownDeptId, depts);
    },
  });
}

// __ROSTER_EXPORT_START__
// 導師名冊匯出（純函式，無 DOM/全域相依，供 test/export-rows.test.js 就地抽出測試）。
// 版面刻意與 Google Sheet 同一套、也就是仿學諮中心既有的「班級、家族會議記錄暨班級業務統計」：
//   一個學院一個分頁；row0 學院名／row1 說明／row2–4 三列表頭／row5 起資料；
//   系別與主任導師(系主任)縱向合併整個系的區塊，同一班多位導師時班級欄也合併。
// 與 Sheet 的唯一差別：**這裡有「私人手機」欄**——匯出是系統內的授權動作，
// 而 Sheet 會被分享出去，所以那邊不放（2026-08-11 決策）。
function buildRosterExportTabs(classes, depts, opts) {
  opts = opts || {};
  const collegeName = opts.collegeName || function (id) { return id || '未分學院'; };
  const stamp = opts.stamp || '';
  const TAB_MAP = {
    '農學院': '農學院', '工學院': '工學院', '管理學院': '管理學院',
    '人文暨社會科學院': '人文學院', '人文社科院': '人文學院',
    '獸醫學院': '獸醫國際達人', '國際學院': '獸醫國際達人', '達人學院': '獸醫國際達人',
  };
  const TAB_ORDER = ['農學院', '工學院', '管理學院', '人文學院', '獸醫國際達人'];
  const HEADER_ROWS = 5;
  const W = 9;   // 系別｜主任姓名｜主任分機｜班級｜班名(原始)｜導師｜分機｜私人手機｜狀態

  const deptById = {};
  (depts || []).forEach(function (d) { if (d) deptById[d.id] = d; });
  const byDept = {};
  (classes || []).forEach(function (c) {
    if (!c || c.deleted === true) return;
    (byDept[c.deptId] = byDept[c.deptId] || []).push(c);
  });
  // 有班級但不在 depts 裡的系所也要出現（不能靜默丟資料）
  const deptIds = (depts || []).map(function (d) { return d.id; });
  Object.keys(byDept).forEach(function (id) { if (deptIds.indexOf(id) === -1) deptIds.push(id); });

  const tabs = {};
  const tabOrder = [];
  deptIds.forEach(function (id) {
    const d = deptById[id] || { id: id, name: id, collegeId: '' };
    const cname = collegeName(d.collegeId);
    const tab = TAB_MAP[cname] || cname;
    if (!tabs[tab]) { tabs[tab] = { rows: [], merges: [] }; tabOrder.push(tab); }
    const t = tabs[tab];
    const head = d.head || {};
    const deptStart = t.rows.length;
    const list = (byDept[id] || []).slice().sort(function (a, b) {
      return String(a.displayName || a.name).localeCompare(String(b.displayName || b.name), 'zh-Hant');
    });
    const deptLabel = d.fullName || d.name || d.id;
    if (!list.length) {
      t.rows.push([deptLabel, head.name || '', head.ext || '', '（此系目前沒有班級）', '', '', '', '', '']);
    } else {
      list.forEach(function (c) {
        const tutors = (c.tutors || []).filter(Boolean);
        const clsStart = t.rows.length;
        const rowsFor = tutors.length ? tutors : [null];
        rowsFor.forEach(function (tu, i) {
          const firstOfDept = (i === 0 && clsStart === deptStart);
          t.rows.push([
            firstOfDept ? deptLabel : '',
            firstOfDept ? (head.name || '') : '',
            firstOfDept ? (head.ext || '') : '',
            i === 0 ? (c.displayName || c.name) : '',
            i === 0 ? c.name : '',
            (tu && tu.name) || '', (tu && tu.ext) || '', (tu && tu.mobile) || '',
            classStateLabelForExport(c),
          ]);
        });
        if (rowsFor.length > 1) {
          [4, 5].forEach(function (col) {
            t.merges.push({ row: HEADER_ROWS + clsStart + 1, col: col, numRows: rowsFor.length, numCols: 1 });
          });
        }
      });
    }
    const span = t.rows.length - deptStart;
    if (span > 1) {
      [1, 2, 3].forEach(function (col) {
        t.merges.push({ row: HEADER_ROWS + deptStart + 1, col: col, numRows: span, numCols: 1 });
      });
    }
  });

  const ordered = TAB_ORDER.filter(function (t) { return tabs[t]; })
    .concat(tabOrder.filter(function (t) { return TAB_ORDER.indexOf(t) === -1; }));

  return ordered.map(function (tab) {
    const t = tabs[tab];
    const values = [];
    values.push([tab, '', '', '', '', '', '', '', '']);
    values.push(['各系導師名冊　匯出時間：' + stamp + '　※本檔含導師私人手機，請比照個資保管。',
      '', '', '', '', '', '', '', '']);
    values.push(['系別', '主任導師(系主任)', '', '班級', '班級名稱(原始)', '導師姓名', '聯絡方式', '', '狀態']);
    values.push(['', '姓名', '校內分機', '', '', '', '校內分機', '私人手機', '']);
    values.push(['', '', '', '', '', '', '', '', '']);
    t.rows.forEach(function (r) { values.push(r); });
    const merges = [
      { row: 1, col: 1, numRows: 1, numCols: W },
      { row: 2, col: 1, numRows: 1, numCols: W },
      { row: 3, col: 2, numRows: 1, numCols: 2 },
      { row: 3, col: 7, numRows: 1, numCols: 2 },
    ];
    [1, 4, 5, 6, 9].forEach(function (col) { merges.push({ row: 3, col: col, numRows: 3, numCols: 1 }); });
    return { tab: tab, values: values, merges: merges.concat(t.merges), rows: t.rows.length, headerRows: HEADER_ROWS, width: W };
  });
}

function classStateLabelForExport(cls) {
  if (!cls) return '';
  const s = [];
  if (cls.active === false) s.push('停用');
  if (cls.graduatedSemester) s.push('已畢業(' + cls.graduatedSemester + ')');
  return s.join('／') || '啟用';
}

// 匯出目前看得到的名冊。範圍三選一：目前系所／目前學院／全部系所。
async function exportDeptRoster(scope) {
  const many = deptRosterDepts.length > 1;
  if (!scope && many) {
    const col = deptRosterCollegeId ? (deptRosterCollegeLabel(deptRosterCollegeId)) : '';
    openModal('匯出 Excel',
      '<p class="field-hint">要匯出哪些系所？<b>私人手機也會寫進檔案裡</b>，下載後請比照個資保管。</p>' +
      '<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">取消</button>' +
      '<button type="button" class="btn" data-action="deptroster-export-one">只匯出目前系所</button>' +
      (deptRosterCollegeId ? '<button type="button" class="btn" data-action="deptroster-export-college">匯出目前學院（' + escapeHtml(col) + '）</button>' : '') +
      '<button type="button" class="btn btn-primary" data-action="deptroster-export-all">匯出全部系所</button></div>');
    return;
  }
  const all = scope === 'all' || scope === 'college';
  try {
    showLoading('準備檔案…');
    await ensureSheetJsLoaded();
    const res = await proxyCall('deptRosterGet', all ? {} : { deptId: deptRosterDeptId });
    let depts = (res.departments || []).length ? res.departments : deptRosterDepts;
    let classes = res.classes || [];
    let who = all ? '全校' : ((depts[0] && (depts[0].fullName || depts[0].name)) || deptRosterDeptId || '');
    if (scope === 'college') {
      const keep = {};
      depts = depts.filter(function (d) {
        const hit = (d.collegeId || '') === deptRosterCollegeId;
        if (hit) keep[d.id] = true;
        return hit;
      });
      classes = classes.filter(function (c) { return keep[c.deptId]; });
      who = deptRosterCollegeLabel(deptRosterCollegeId);
    }
    const tabs = buildRosterExportTabs(classes, depts, {
      collegeName: function (id) { const c = collegeById(id); return (c && c.name) || id || '未分學院'; },
      stamp: todayStamp(),
    });
    if (!tabs.length) { showToast('沒有可匯出的資料', 'error'); return; }
    const wb = XLSX.utils.book_new();
    tabs.forEach(function (t) {
      const ws = XLSX.utils.aoa_to_sheet(t.values);
      ws['!merges'] = t.merges.map(function (m) {
        return { s: { r: m.row - 1, c: m.col - 1 }, e: { r: m.row + m.numRows - 2, c: m.col + m.numCols - 2 } };
      });
      ws['!cols'] = [{ wch: 22 }, { wch: 12 }, { wch: 10 }, { wch: 16 }, { wch: 14 }, { wch: 12 }, { wch: 10 }, { wch: 14 }, { wch: 12 }];
      ws['!freeze'] = { xSplit: 0, ySplit: t.headerRows };
      XLSX.utils.book_append_sheet(wb, ws, t.tab);
    });
    XLSX.writeFile(wb, '導師名冊_' + who + '_' + todayStamp() + '.xlsx');
    showToast('已匯出 ' + tabs.length + ' 個分頁、' + tabs.reduce(function (n, t) { return n + t.rows; }, 0) + ' 列', 'success');
  } catch (e) {
    showToast('匯出失敗：' + e.message, 'error');
  } finally {
    hideLoading();
    closeModal();
  }
}

function todayStamp() {
  const d = new Date();
  const p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
}

// 系辦助理帳號的匯出列（純函式）。用途是「寄通知信給各系」：要的就是帳號＋分機。
// 初始密碼＝分機的第一段數字（與後端 initialPasswordFromExtGas_ 同規則），但**只在該帳號
// 仍是初始密碼時才填**——已自行改過的人再列出分機會誤導收信的人去打一個沒用的密碼。
function buildDeptAccountExportRows(rows, deptNameById) {
  const nameOf = deptNameById || function (id) { return id; };
  return (rows || []).map(function (r) {
    const ext = String(r.ext == null ? '' : r.ext).trim();
    const first = (ext.match(/\d+/) || [''])[0];
    const acct = String(r.email || '').split('@')[0].toLowerCase();
    const state = !r.hasAccount ? '尚未建立' : (r.accountDisabled ? '已停用' : '啟用');
    return {
      '系所': (r.deptIds || []).map(nameOf).join('、'),
      '姓名': r.name || '',
      '登入帳號': acct,
      'Email': r.email || '',
      '分機': ext,
      '初始密碼': (r.hasAccount && r.mustChangePassword) ? first : (!r.hasAccount ? first : ''),
      '帳號狀態': state,
      '密碼': !r.hasAccount ? '—' : (r.mustChangePassword ? '仍是初始密碼' : '已自行更改'),
    };
  });
}

function renderDeptRosterTable(classes, deptId, depts) {
  // 未指定 deptId 的第一趟會拿到多系的班級；選單有值時只顯示該系，避免與選單所示不一致。
  const rows = deptId ? classes.filter(function (c) { return c.deptId === deptId; }) : classes;
  if (!rows.length) {
    $('deptroster-content').innerHTML = '<div class="empty-hint">這個系所目前沒有班級。</div>';
    return;
  }
  const sorted = rows.slice().sort(function (a, b) {
    return String(a.displayName || a.name).localeCompare(String(b.displayName || b.name), 'zh-Hant');
  });
  const tutorCount = sorted.reduce(function (n, c) { return n + (c.tutors || []).length; }, 0);
  // 這個平台要收的就是手機，所以待辦數以「還沒有私人手機」計（分機沒填不算缺口）。
  const noMobile = sorted.reduce(function (n, c) {
    return n + (c.tutors || []).filter(function (t) { return !t.mobile; }).length;
  }, 0);
  deptRosterCache = sorted;
  // 每位導師一列（同班多位導師用 <br> 疊在同一格），欄位對齊靠同順序輸出。
  const stack = function (tutors, pick, missingWarn) {
    if (!tutors.length) return '<span class="field-hint">—</span>';
    return tutors.map(function (t) {
      const v = pick(t);
      if (v) return escapeHtml(v);
      return missingWarn
        ? '<span style="color:var(--color-warning);">（未填）</span>'
        : '<span class="field-hint">（未填）</span>';
    }).join('<br>');
  };
  $('deptroster-content').innerHTML =
    '<p class="field-hint">共 ' + sorted.length + ' 班、' + tutorCount + ' 位導師' +
      (noMobile ? '，其中 <b>' + noMobile + '</b> 位還沒有私人手機' : '（私人手機都填好了）') + '。</p>' +
    '<div class="table-wrap"><table><thead><tr><th>班級</th><th>班級名稱(原始)</th><th>導師</th><th>校內分機</th><th>私人手機</th><th>狀態</th><th>操作</th></tr></thead><tbody>' +
    sorted.map(function (c) {
      const tutors = c.tutors || [];
      const names = tutors.length ? tutors.map(function (t) { return escapeHtml(t.name || '（未填姓名）'); }).join('<br>') : '<span class="field-hint">（尚無導師）</span>';
      const state = [];
      if (c.active === false) state.push('停用');
      if (c.graduatedSemester) state.push('已畢業（' + escapeHtml(c.graduatedSemester) + '）');
      return '<tr><td data-label="班級">' + escapeHtml(c.displayName || c.name) + '</td>' +
        '<td data-label="班級名稱(原始)">' + escapeHtml(c.name) + '</td>' +
        '<td data-label="導師">' + names + '</td>' +
        '<td data-label="校內分機">' + stack(tutors, function (t) { return t.ext; }, false) + '</td>' +
        '<td data-label="私人手機">' + stack(tutors, function (t) { return t.mobile; }, true) + '</td>' +
        '<td data-label="狀態">' + (state.length ? state.join('／') : '啟用') + '</td>' +
        '<td data-label="操作"><button class="btn btn-sm" data-action="deptroster-edit" data-class-id="' + escapeHtml(c.id) + '">編輯</button> ' +
        '<button class="btn btn-sm btn-danger" data-action="deptroster-delete" data-class-id="' + escapeHtml(c.id) + '">刪除</button></td></tr>';
    }).join('') + '</tbody></table></div>';
}

// ── 系辦助理白名單（Phase 1）──────────────────────────────────────────────────
// 與上面的「學諮中心助理」是兩回事：這裡是各系系辦的助理，用來維護本系導師名冊。
// 一人可掛多系；deptIds 是授權範圍的唯一來源，後端每個 action 都會拿它重驗。
function deptNameById(id) {
  const d = (bootstrapData.departments || []).find(function (x) { return x.id === id; });
  return d ? (d.name || d.id) : id;
}

// ── 系辦助理兩個分頁共用的「學院 → 系所」篩選 ────────────────────────────────
// 47 筆白名單一次攤平列出，要找某一系得整頁捲——跟導師資料頁同一個毛病。兩個分頁
// （白名單／帳號）用同一組狀態，切分頁時篩選條件不會跑掉。
let deptAsstFilterCollege = '';   // '' ＝全部學院；'__none__' ＝未分學院
let deptAsstFilterDept = '';      // '' ＝該學院全部系所

const COLLEGE_NONE = '__none__';

function deptCollegeKey(deptId) {
  const d = deptById(deptId);
  return (d && d.collegeId) || COLLEGE_NONE;
}

function deptAsstFilterDepts() {
  const depts = (bootstrapData.departments || []).filter(notDeleted);
  if (!deptAsstFilterCollege) return depts;
  return depts.filter(function (d) { return ((d.collegeId || COLLEGE_NONE)) === deptAsstFilterCollege; });
}

// 一列（一位助理）掛的系所有任一個命中就顯示；沒掛任何系所的只有「不篩選」時才看得到。
function deptAsstRowMatches(deptIds) {
  const ids = Array.isArray(deptIds) ? deptIds : [];
  if (deptAsstFilterDept) return ids.indexOf(deptAsstFilterDept) !== -1;
  if (!deptAsstFilterCollege) return true;
  return ids.some(function (id) { return deptCollegeKey(id) === deptAsstFilterCollege; });
}

function deptAsstFilterHtml() {
  const depts = (bootstrapData.departments || []).filter(notDeleted);
  const keys = [];
  depts.forEach(function (d) {
    const k = d.collegeId || COLLEGE_NONE;
    if (keys.indexOf(k) === -1) keys.push(k);
  });
  keys.sort(function (a, b) {
    const ca = collegeById(a);
    const cb = collegeById(b);
    const oa = (ca && ca.order != null) ? ca.order : 9999;
    const ob = (cb && cb.order != null) ? cb.order : 9999;
    return oa - ob;
  });
  const colOpts = '<option value="">全部學院</option>' + keys.map(function (k) {
    const label = k === COLLEGE_NONE ? '未分學院' : ((collegeById(k) && collegeById(k).name) || k);
    const n = depts.filter(function (d) { return (d.collegeId || COLLEGE_NONE) === k; }).length;
    return '<option value="' + escapeHtml(k) + '"' + (k === deptAsstFilterCollege ? ' selected' : '') + '>' +
      escapeHtml(label) + '（' + n + '）</option>';
  }).join('');
  const deptOpts = '<option value="">全部系所</option>' + deptAsstFilterDepts().map(function (d) {
    return '<option value="' + escapeHtml(d.id) + '"' + (d.id === deptAsstFilterDept ? ' selected' : '') + '>' +
      escapeHtml(d.name || d.id) + '</option>';
  }).join('');
  return '<div class="row">' +
    '<div class="field" style="max-width:240px;"><label>學院</label><select id="deptasst-filter-college">' + colOpts + '</select></div>' +
    '<div class="field" style="max-width:240px;"><label>系所</label><select id="deptasst-filter-dept">' + deptOpts + '</select></div>' +
    '</div>';
}

// 兩個分頁各自把「重畫自己」的函式傳進來；選單值改了就換條件重畫。
function bindDeptAsstFilter(rerender) {
  const colSel = $('deptasst-filter-college');
  const deptSel = $('deptasst-filter-dept');
  if (!colSel || !deptSel) return;
  colSel.addEventListener('change', function () {
    deptAsstFilterCollege = colSel.value;
    // 換學院後原本選的系所若不屬於這個學院，就退回「全部系所」
    const stillThere = deptAsstFilterDepts().some(function (d) { return d.id === deptAsstFilterDept; });
    if (!stillThere) deptAsstFilterDept = '';
    rerender();
  });
  deptSel.addEventListener('change', function () {
    deptAsstFilterDept = deptSel.value;
    rerender();
  });
}

// 系辦助理（合併頁）：白名單（授權）與登入帳號（認證）本來就是兩份資料、兩個 action，
// 但對使用者而言是同一個人——原本切成兩個分頁看，Email/姓名/分機/系所四欄完全重複，
// 要查一個人得來回切。這裡合成一列顯示，**架構不動**：白名單仍走 bootstrap 的
// config.deptAssistants，帳號狀態仍走 serverAdminCall('list')。
// 帳號那一趟失敗時只有帳號三欄顯示「讀取失敗」，白名單照樣看得到（GAS 軌與自架軌取帳號的
// 方式不同，不能讓它的失敗把整頁吃掉）。
let deptAccountsState = 'idle';   // idle | loading | ok | error
let deptAccountsError = '';

// 進入分頁＝一定重抓帳號狀態；其他重畫（切篩選、動作完成後）沿用已抓到的資料。
// 分開的原因：renderAdminDeptAssistants 會被篩選器反覆呼叫，若在裡面無條件重抓就會遞迴。
function enterAdminDeptAssistants() {
  deptAccountsState = 'idle';
  renderAdminDeptAssistants();
}

function renderAdminDeptAssistants() {
  // 列來源：帳號那一趟（serverAdminCall('list')）的回傳其實就是「白名單 join 帳號狀態」，
  // 而且是**當下**從後端讀的；bootstrapData.deptAssistants 是登入時的快照，別人剛加的人
  // 不會出現在裡面。所以有拿到就用它，拿不到才退回快照。
  const fromServer = deptAccountsState === 'ok' && deptAccountRows.length;
  const all = (fromServer
    ? deptAccountRows.map(function (r) {
        return { email: r.email, name: r.name, ext: r.ext, deptIds: r.deptIds || [], disabled: r.assistantDisabled === true };
      })
    : (bootstrapData.deptAssistants || []).filter(notDeleted));
  const rows = all.filter(function (s) { return deptAsstRowMatches(s.deptIds); });
  const acctBy = {};
  (deptAccountRows || []).forEach(function (r) { acctBy[String(r.email || '').toLowerCase()] = r; });

  const acctCells = function (email) {
    if (deptAccountsState === 'loading' || deptAccountsState === 'idle') {
      return '<td data-label="帳號" class="field-hint">載入中…</td><td data-label="密碼" class="field-hint">…</td>';
    }
    if (deptAccountsState === 'error') {
      return '<td data-label="帳號" class="field-hint">讀取失敗</td><td data-label="密碼" class="field-hint">—</td>';
    }
    const r = acctBy[String(email || '').toLowerCase()];
    if (!r || !r.hasAccount) {
      return '<td data-label="帳號"><span style="color:var(--color-danger);">尚未建立</span></td>' +
        '<td data-label="密碼">—</td>';
    }
    return '<td data-label="帳號">' + (r.accountDisabled ? '<span style="color:var(--color-danger);">已停用</span>' : '啟用') + '</td>' +
      '<td data-label="密碼">' + (r.mustChangePassword
        ? '<span style="color:var(--color-warning);">仍是初始密碼</span>' : '已自行更改') + '</td>';
  };
  const acctOps = function (s) {
    if (deptAccountsState !== 'ok') return '';
    const r = acctBy[String(s.email || '').toLowerCase()];
    const ops = [];
    if (!s.ext) ops.push('<span class="field-hint">未填分機</span>');
    else ops.push('<button class="btn btn-sm" data-action="deptacct-reset" data-email="' + escapeHtml(s.email) + '">' +
      (r && r.hasAccount ? '重設為分機' : '建立帳號') + '</button>');
    if (r && r.hasAccount) {
      ops.push('<button class="btn btn-sm" data-action="deptacct-toggle" data-email="' + escapeHtml(s.email) + '" data-disabled="' + (r.accountDisabled ? '0' : '1') + '">' +
        (r.accountDisabled ? '啟用帳號' : '停用帳號') + '</button>');
    }
    return ' ' + ops.join(' ');
  };

  const noAccount = deptAccountsState === 'ok'
    ? rows.filter(function (s) { const r = acctBy[String(s.email || '').toLowerCase()]; return !r || !r.hasAccount; }).length : null;
  const initial = deptAccountsState === 'ok'
    ? rows.filter(function (s) { const r = acctBy[String(s.email || '').toLowerCase()]; return r && r.hasAccount && r.mustChangePassword; }).length : null;

  $('admin-tab-content').innerHTML =
    '<div class="card"><h3>系辦助理</h3>' +
    '<p class="field-hint">各系系辦助理維護本系導師名冊用。<b>只看得到自己掛的系所</b>，看不到他系；' +
    '一人可掛多個系所。名單裡掛的系所若被停用或刪除，該系的權限會立刻消失。<br>' +
    '登入帳號＝這裡的 email（登入時可只打 @ 前面那段），<b>初始密碼＝分機</b>，首次登入會要求改密碼。' +
    '沒填分機的無法建立帳號。</p>' +
    deptAsstFilterHtml() +
    '<p class="field-hint">顯示 <b>' + rows.length + '</b> / ' + all.length + ' 筆' +
      (noAccount === null ? '' : '（其中 <b>' + noAccount + '</b> 人尚無帳號、<b>' + initial + '</b> 人仍是初始密碼）') +
      (deptAccountsState === 'error' ? '。<span style="color:var(--color-danger);">帳號狀態讀取失敗：' + escapeHtml(deptAccountsError) + '</span>' : '。') + '</p>' +
    '<div class="admin-toolbar">' +
    '<button class="btn btn-primary" data-action="deptasst-new">新增系辦助理</button> ' +
    '<button class="btn" data-action="deptasst-bulk">批次匯入（貼上 JSON）</button> ' +
    '<button class="btn" data-action="deptacct-create-all">為所有尚無帳號者建立帳號</button> ' +
    '<button class="btn" data-action="deptacct-export">匯出 Excel</button> ' +
    '<button class="btn btn-sm" data-action="deptasst-reset-colw" data-tip="清除已儲存的欄寬，恢復預設比例">重設欄寬</button>' +
    '</div>' +
    '<div class="table-wrap"><table id="deptasst-table">' +
    '<colgroup>' + DEPTASST_COL_NUMS.map(function (n) { return '<col id="deptasst-col-' + n + '">'; }).join('') + '</colgroup>' +
    '<thead><tr><th data-col="1">系所</th><th data-col="2">姓名</th><th data-col="3">Email</th><th data-col="4">分機</th>' +
    '<th data-col="5">白名單</th><th data-col="6">帳號</th><th data-col="7">密碼</th><th data-col="8">操作</th></tr></thead><tbody>' +
    (rows.length ? rows.map(function (s) {
      const ids = Array.isArray(s.deptIds) ? s.deptIds : [];
      return '<tr>' +
        '<td data-label="系所">' + (ids.length ? ids.map(function (id) { return escapeHtml(deptNameById(id)); }).join('、') : '<span class="field-hint">（未指定）</span>') + '</td>' +
        '<td data-label="姓名">' + escapeHtml(s.name || '') + '</td>' +
        '<td data-label="Email">' + escapeHtml(s.email) + '</td>' +
        '<td data-label="分機">' + escapeHtml(s.ext || '') + '</td>' +
        '<td data-label="白名單">' + (s.disabled ? '停用' : '啟用') + '</td>' +
        acctCells(s.email) +
        '<td data-label="操作"><button class="btn btn-sm" data-action="deptasst-edit" data-email="' + escapeHtml(s.email) + '">編輯</button> ' +
        '<button class="btn btn-sm btn-danger" data-action="deptasst-delete" data-email="' + escapeHtml(s.email) + '">刪除</button>' +
        acctOps(s) + '</td></tr>';
    }).join('') : '<tr><td colspan="8"><div class="empty-hint">' +
      (all.length ? '這個篩選條件下沒有系辦助理。' : '尚未建立任何系辦助理。') + '</div></td></tr>') +
    '</tbody></table></div></div>';
  bindDeptAsstFilter(renderAdminDeptAssistants);
  makeDeptAsstTableResizable();
  if (deptAccountsState === 'idle') loadDeptAccounts();

// 批次匯入白名單：37 個系所手 key 太痛苦，而名單本身是個資、不能進 repo，
// 所以做成「貼上 JSON」——資料留在使用者手上，只在匯入當下經過瀏覽器。
// 同一個 email 出現在多列會自動合併 deptIds（白名單以 email 為鍵），規則與
// server/scripts/upsert-dept-assistants.js 的 mergeByEmail 一致。
function mergeDeptAssistantRows(rows) {
  const byEmail = new Map();
  rows.forEach(function (r, i) {
    const email = String((r && r.email) || '').trim().toLowerCase();
    if (!email) throw new Error('第 ' + (i + 1) + ' 列缺 email');
    const deptId = String((r && r.deptId) || '').trim();
    if (!byEmail.has(email)) {
      byEmail.set(email, { email: email, name: String(r.name || '').trim(), ext: String(r.ext || '').trim(), deptIds: [] });
    }
    const e = byEmail.get(email);
    // 支援兩種輸入形狀：一列一個 deptId，或一列帶 deptIds 陣列
    const ids = deptId ? [deptId] : (Array.isArray(r.deptIds) ? r.deptIds : []);
    ids.forEach(function (id) { if (id && e.deptIds.indexOf(id) === -1) e.deptIds.push(String(id).trim()); });
  });
  return Array.from(byEmail.values());
}

// ── 系辦助理的「登入帳號」管理 ────────────────────────────────────────────────
// 本機帳密那一層活在自架的 server/ 裡（users.json），不是 Code.gs 的資料，
// 所以走 /admin/accounts 而不是 proxyCall。GAS 軌沒有這個端點——抓不到就顯示說明，
// 不讓分頁看起來像壞掉。授權在後端：session token → resolveRoles_ → isAdmin。
async function serverAdminCall(op, params) {
  // 兩軌同一套 UI、兩種傳輸：自架軌的本機帳號活在 server/ 的 users.json（走 /admin/accounts），
  // GAS 軌活在 Drive 的 localAccounts.json（走 adminLocalAccounts action）。op 名稱刻意一致。
  if (!isSelfHosted()) return proxyCall('adminLocalAccounts', Object.assign({ op: op }, params || {}));
  // 用模組層級的 sessionToken（load() 已從 localStorage 還原並驗過效期），不另外讀一次。
  const body = Object.assign({ op: op, sessionToken: sessionToken }, params || {});
  const res = await fetch('./admin/accounts', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error('伺服器回應 ' + res.status);
  const json = await res.json();
  if (!json || json.success !== true) throw new Error((json && json.error) || '操作失敗');
  return json.data || {};
}

    patch[key] = { label: (rules[key] && rules[key].label) || key, keywords: keywords };
  });
  try {
    await withBtnPending(btn, async function () {
      const res = await proxyCall('adminSetKeywordRules', { keywordRules: patch });
      bootstrapData.keywordRules = res.keywordRules;
      showToast('已儲存', 'success');
    });
  } catch (err) {
    showToast('儲存失敗：' + err.message, 'error');
  }
});

// 批次套用中心的「系所清冊」：一次設定各系正式全名，並把該系系辦助理的登入密碼
// （＝白名單的 ext，也就是初始密碼來源）改成清冊上的系主任分機。
// **先預演再套用**：37 個系所、47 個帳號，看不到計畫就按下去太可怕。
function openDeptSheetBulkForm() {
  openModal('批次套用系所清冊',
    '<p class="field-hint">貼上 JSON 陣列，每列 <code>{"deptId","fullName","ext"}</code>。' +
    '<b>fullName</b> 會寫進「正式全名」（不動內部簡稱名，那是班級顯示名的來源）；' +
    '<b>ext</b> 是系主任分機，會成為該系系辦助理的<b>登入密碼</b>（並要求首次登入更改）。</p>' +
    '<div class="field"><label><input type="checkbox" id="deptsheet-force"> 連「已自行改過密碼」的帳號也一起重設</label>' +
    '<span class="field-hint">預設不動已自訂密碼的人——重設會把他們鎖在外面。</span></div>' +
    '<div class="field"><textarea id="deptsheet-json" rows="8" style="width:100%; font-family:monospace; font-size:.8rem;" ' +
    'placeholder=\'[{"deptId":"農園系","fullName":"農園生產系","ext":"6247"}]\'></textarea></div>' +
    '<div id="deptsheet-result"></div>' +
    '<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">取消</button>' +
    '<button type="button" class="btn" id="deptsheet-preview">預演（不寫入）</button>' +
    '<button type="button" class="btn btn-primary" id="deptsheet-apply" disabled>確認套用</button></div>');

  let lastRows = null;
  const run = async function (btn, apply) {
    let rows;
    try {
      rows = JSON.parse($('deptsheet-json').value);
      if (!Array.isArray(rows) || !rows.length) throw new Error('要是一個非空的陣列');
    } catch (err) {
      $('deptsheet-result').innerHTML = '<div class="import-error-box">JSON 解析失敗：' + escapeHtml(err.message) + '</div>';
      return;
    }
    try {
      await withBtnPending(btn, async function () {
        const res = await proxyCall('adminBulkApplyDeptSheet', {
          rows: rows, apply: apply, force: $('deptsheet-force').checked,
        });
        const s = res.summary || {};
        $('deptsheet-result').innerHTML =
          '<p class="field-hint"><b>' + escapeHtml(s['模式'] || '') + '</b>：系所 ' + s['系所數'] +
          '（全名有變動 ' + s['全名有變動'] + '）、助理 ' + s['助理筆數'] +
          ' → 建立帳號 ' + s['將建立帳號'] + '、重設密碼 ' + s['將重設密碼'] +
          '、跳過已自訂密碼 ' + s['跳過已自訂密碼'] + '。' +
          ((s['沒有助理的系所'] || []).length ? '<br>沒有助理的系所：' + escapeHtml((s['沒有助理的系所'] || []).join('、')) : '') +
          '</p>';
        if (!apply) { lastRows = rows; $('deptsheet-apply').disabled = false; }
        else {
          showToast('已套用', 'success');
          bootstrapData.departments = bootstrapData.departments;   // 全名要重新載入才看得到
          await refreshBootstrap();
        }
      });
    } catch (err) {
      $('deptsheet-result').innerHTML = '<div class="import-error-box">' + (apply ? '套用' : '預演') + '失敗：' + escapeHtml(err.message) + '</div>';
    }
  };
  $('deptsheet-preview').addEventListener('click', function (e) { run(e.target, false); });
  $('deptsheet-apply').addEventListener('click', function (e) {
    if (!lastRows) { showToast('請先預演', 'error'); return; }
    if (!confirm('將套用系所全名，並把各系系辦助理的登入密碼改成清冊上的系主任分機。確定？')) return;
    run(e.target, true);
  });
}

document.body.addEventListener('click', function (e) {
  if (e.target.closest('[data-action="dept-new"]')) { openDeptForm(); return; }
  if (e.target.closest('[data-action="depthead-bulk"]')) { openDeptHeadBulkForm(); return; }
  if (e.target.closest('[data-action="deptsheet-bulk"]')) { openDeptSheetBulkForm(); return; }
  const editBtn = e.target.closest('[data-action="dept-edit"]');
  if (editBtn) { openDeptForm(deptById(editBtn.dataset.id)); return; }
  const delBtn = e.target.closest('[data-action="dept-delete"]');
  if (delBtn) {
    const d = deptById(delBtn.dataset.id);
    if (!d) return;
    deleteEntity({
      btn: delBtn, name: d.name, action: 'adminUpsertDepartment', payload: { department: { id: d.id, deleted: true } },
      onDone: function (res) { bootstrapData.departments = res.departments; renderAdminDepartments(); },
    });
  }
});

// ── 班級 ──

// 收集所有班級的待確認導師建議（admin 專用；admin 的 bootstrap classes 未過濾，含 by/email/at）。
function pendingSuggestionList() {
  const out = [];
  (bootstrapData.classes || []).filter(notDeleted).forEach(function (c) {
    ((c && c.suggestedTutors) || []).forEach(function (s, i) {
      out.push({ classId: c.id, idx: i, className: c.name, deptId: c.deptId, name: s.name, email: s.email || '', by: s.by || '', at: s.at || '' });
    });
  });
  return out;
}

function requiredMeetingCountDisplay(c) {
  if (c.requiredMeetingOverride === 0) return '0（免繳）';
  if (c.requiredMeetingOverride != null) return c.requiredMeetingOverride + '（覆寫）';
  const sys = tutorSystemById(c.systemId);
  if (sys && sys.requiredMeetingCount != null) return sys.requiredMeetingCount + '（制度預設）';
  return '（未設定）';
}

// ── 班級管理視圖狀態（模組層級，切分頁/編輯後重繪都保留；重新整理頁面歸零）──
let adminClassTab = null;                    // 當前學院分頁 key（=college.id；'' = 未分學院）
const adminClassCollapsedDepts = new Set();  // 已收合的系所群組（deptId）

// 班級 → 學院歸屬鏈：class.deptId → departments[].collegeId → colleges[].id。
// 系所沒掛學院、或掛的學院已停用/刪除 → 歸「未分學院」（照樣顯示，資料不會憑空消失）。
function classCollegeKey(cls) {
  const dept = deptById(cls.deptId);
  const college = (dept && dept.collegeId) ? collegeById(dept.collegeId) : null;
  return (college && college.deleted !== true && !college.disabled) ? college.id : '';
}

function classRowHtml(c) {
  return '<tr><td data-label="ID">' + escapeHtml(c.id) + '</td>' +
    '<td data-label="顯示名稱">' + escapeHtml(c.displayName || c.name) + '</td>' +
    '<td data-label="原始名稱">' + escapeHtml(c.name) + '</td>' +
    '<td data-label="制度">' + escapeHtml((tutorSystemById(c.systemId) || {}).name || '（未設定）') + '</td>' +
    '<td data-label="應繳份數">' + requiredMeetingCountDisplay(c) + '</td>' +
    '<td data-label="導師">' + (c.tutors || []).map(function (t) { return escapeHtml(t.name) + '（' + escapeHtml(t.email) + '）'; }).join('、') + '</td>' +
    '<td data-label="狀態">' + (c.active === false ? '停用' : '啟用') + '</td>' +
    '<td data-label="操作"><button class="btn btn-sm" data-action="class-edit" data-id="' + escapeHtml(c.id) + '">編輯</button> ' +
    '<button class="btn btn-sm" data-action="class-history" data-id="' + escapeHtml(c.id) + '">歷史</button> ' +
    '<button class="btn btn-sm btn-danger" data-action="class-delete" data-id="' + escapeHtml(c.id) + '">刪除</button></td></tr>';
}

function renderAdminClasses() {
  const classes = (bootstrapData.classes || []).filter(notDeleted);
  const pending = pendingSuggestionList();

  const pendingHtml = pending.length
    ? '<div class="card"><h3>待確認導師建議（' + pending.length + '）</h3>' +
      '<p class="field-hint">學生上傳時自填的導師。「轉正式導師」後才具核章身分；無 email 者須先補 email。</p>' +
      '<div class="table-wrap"><table><thead><tr><th>系所</th><th>班級</th><th>姓名</th><th>Email</th><th>建議時間</th><th>操作</th></tr></thead><tbody>' +
      pending.map(function (p) {
        return '<tr><td data-label="系所">' + escapeHtml(deptName(p.deptId)) + '</td>' +
          '<td data-label="班級">' + escapeHtml(p.className) + '</td>' +
          '<td data-label="姓名">' + escapeHtml(p.name) + '</td>' +
          '<td data-label="Email">' + (p.email ? escapeHtml(p.email) : '<span class="field-hint">（未填）</span>') + '</td>' +
          '<td data-label="建議時間">' + escapeHtml(formatDateTime(p.at)) + '</td>' +
          '<td data-label="操作">' +
            '<button class="btn btn-sm btn-primary" data-action="sug-promote" data-class="' + escapeHtml(p.classId) + '" data-idx="' + p.idx + '">' +
              (p.email ? '轉正式導師' : '補 email 後轉正') + '</button> ' +
            '<button class="btn btn-sm" data-action="sug-remove" data-class="' + escapeHtml(p.classId) + '" data-idx="' + p.idx + '">移除</button>' +
          '</td></tr>';
      }).join('') + '</tbody></table></div></div>'
    : '';

  // 學院分頁（仿匯入預覽/統計頁）：依學院清單的排序出 tab（沒有班級的學院不出）；
  // 「未分學院」（歸屬鏈斷掉的班）若有，固定放最後。
  const byKey = {};
  classes.forEach(function (c) {
    const k = classCollegeKey(c);
    (byKey[k] = byKey[k] || []).push(c);
  });
  const keys = (bootstrapData.colleges || []).filter(notDeleted).slice()
    .sort(function (a, b) { return (a.order || 0) - (b.order || 0); })
    .map(function (c) { return c.id; })
    .filter(function (k) { return byKey[k]; });
  if (byKey['']) keys.push('');
  if (keys.indexOf(adminClassTab) === -1) adminClassTab = keys[0] || '';

  let bodyHtml;
  if (!classes.length) {
    bodyHtml = '<div class="empty-hint">尚無班級。</div>';
  } else {
    const tabClasses = byKey[adminClassTab] || [];
    // 分頁內依系所分群（依出現順序）；群組可收合（狀態在 adminClassCollapsedDepts）
    const groupMap = {};
    const groups = [];
    tabClasses.forEach(function (c) {
      const d = String(c.deptId || '');
      if (!groupMap[d]) { groupMap[d] = { deptId: d, list: [] }; groups.push(groupMap[d]); }
      groupMap[d].list.push(c);
    });
    const deptIdsCsv = groups.map(function (g) { return g.deptId; }).join(',');

    bodyHtml =
      '<div class="tab-bar">' + keys.map(function (k) {
        const label = k === '' ? '未分學院' : ((collegeById(k) || {}).name || k);
        return '<button type="button" class="tab-btn' + (k === adminClassTab ? ' active' : '') + '" data-class-tab="' + escapeHtml(k) + '">' +
          escapeHtml(label) + '（' + byKey[k].length + '）</button>';
      }).join('') + '</div>' +
      '<div style="display:flex; gap:8px; margin-bottom:8px; align-items:center;">' +
        '<button type="button" class="btn btn-sm" data-class-collapse-all="' + escapeHtml(deptIdsCsv) + '">全部收合</button>' +
        '<button type="button" class="btn btn-sm" data-class-expand-all="' + escapeHtml(deptIdsCsv) + '">全部展開</button>' +
        '<span class="field-hint" style="margin:0;">（點系所標題列可收合/展開該系）</span>' +
      '</div>' +
      '<div class="table-wrap"><table><thead><tr><th>ID</th><th>顯示名稱</th><th>原始名稱</th><th>制度</th><th>應繳份數</th><th>導師</th><th>狀態</th><th>操作</th></tr></thead><tbody>' +
      groups.map(function (g) {
        const collapsed = adminClassCollapsedDepts.has(g.deptId);
        return '<tr class="dept-group-head" data-class-dept-toggle="' + escapeHtml(g.deptId) + '"><td colspan="8">' +
          (collapsed ? '▸' : '▾') + ' ' + escapeHtml(deptName(g.deptId)) + '（' + g.list.length + ' 班）' +
          (collapsed ? ' <span class="field-hint" style="display:inline; font-weight:400;">已收合，點擊展開</span>' : '') +
          '</td></tr>' +
          (collapsed ? '' : g.list.map(classRowHtml).join(''));
      }).join('') + '</tbody></table></div>';
  }

  $('admin-tab-content').innerHTML =
    pendingHtml +
    '<div class="card"><h3>班級清單</h3>' + bodyHtml +
    '<button class="btn btn-primary" data-action="class-new" style="margin-top:12px;">新增班級</button></div>';
}

// 班級管理：學院分頁切換／系所群組收合展開（視圖狀態寫模組層級變數，重繪保留）
document.body.addEventListener('click', function (e) {
  const tabBtn = e.target.closest('[data-class-tab]');
  if (tabBtn) { adminClassTab = tabBtn.dataset.classTab; renderAdminClasses(); return; }
  const toggleRow = e.target.closest('[data-class-dept-toggle]');
  if (toggleRow) {
    const id = toggleRow.dataset.classDeptToggle;
    if (adminClassCollapsedDepts.has(id)) adminClassCollapsedDepts.delete(id);
    else adminClassCollapsedDepts.add(id);
    renderAdminClasses();
    return;
  }
  const collapseAll = e.target.closest('[data-class-collapse-all]');
  if (collapseAll) {
    collapseAll.dataset.classCollapseAll.split(',').forEach(function (id) { if (id) adminClassCollapsedDepts.add(id); });
    renderAdminClasses();
    return;
  }
  const expandAll = e.target.closest('[data-class-expand-all]');
  if (expandAll) {
    expandAll.dataset.classExpandAll.split(',').forEach(function (id) { if (id) adminClassCollapsedDepts.delete(id); });
    renderAdminClasses();
  }
});

// ── 導師歷史＋期中更換（Ticket C）──
// 歷史 modal：按需呼叫 tutorHistoryGet（bootstrap 不帶 tutorHistory，控制 payload）。
const TUTOR_CHANGE_TYPE_LABELS = { manual: '手動編輯', midterm: '期中更換', import: '匯入', rollover: '升級帶入' };

function tutorListLabel(list) {
  const names = (list || []).map(function (t) { return (t && t.name) || ''; }).filter(Boolean);
  return names.length ? names.join('、') : '（無）';
}

// midterm 的生效日以「X月X日更換」呈現；其他類型不顯示生效日。
function effectiveDateLabel(entry) {
  if (!entry || entry.changeType !== 'midterm' || !entry.effectiveDate) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(entry.effectiveDate);
  return m ? (Number(m[2]) + '月' + Number(m[3]) + '日更換') : entry.effectiveDate;
}

// 建議轉正/移除：沿用 adminUpsertClass 送整包 class（tutors 只有 admin action 能動）。
// btn（選填）：觸發此動作的按鈕，走 withBtnPending 統一回饋；未附 email 需先跳補填 modal 的
// 早退路徑（尚未真正呼叫後端）不套用 pending 視覺。
async function applySuggestionAction(classId, idx, promote, emailOverride, btn) {
  const c = classById(classId);
  if (!c || !c.suggestedTutors || !c.suggestedTutors[idx]) { showToast('找不到該筆建議，請重新整理', 'error'); return; }
  const s = c.suggestedTutors[idx];
  const remaining = c.suggestedTutors.filter(function (_, i) { return i !== idx; });
  const entry = Object.assign({}, c, { suggestedTutors: remaining });
  if (promote) {
    const email = (emailOverride || s.email || '').trim().toLowerCase();
    if (!email) { openSuggestionEmailModal(classId, idx); return; }
    if (!EMAIL_RE.test(email)) { showToast('Email 格式不正確', 'error'); return; }
    if ((c.tutors || []).length >= 2) { showToast('該班已有兩位導師，請先於班級編輯調整後再轉正', 'error'); return; }
    entry.tutors = (c.tutors || []).concat([{ name: s.name, email: email }]);
  }
  try {
    await withBtnPending(btn, async function () {
      const res = await proxyCall('adminUpsertClass', { class: entry });
      bootstrapData.classes = res.classes;
      showToast(promote ? '已轉為正式導師' : '已移除建議', 'success');
      closeModal();
      renderNav();
      renderAdminClasses();
    });
  } catch (err) { showToast('操作失敗：' + err.message, 'error'); }
}

  });

  $('class-form').addEventListener('submit', async function (e) {

    const name = $('class-name').value.trim();

  if (semesters.length < 2) { showToast('至少需要兩個學期才能執行帶入', 'error'); return; }
  const currentId = bootstrapData.semester || semesters[semesters.length - 1].id;
  const curIdx = semesters.findIndex(function (s) { return s.id === currentId; });
  const defaultTo = curIdx !== -1 ? semesters[curIdx].id : semesters[semesters.length - 1].id;
  const defaultFrom = curIdx > 0 ? semesters[curIdx - 1].id : semesters[0].id;

  function semOptions(selectedId) {
    return semesters.map(function (s) {
      return '<option value="' + escapeHtml(s.id) + '"' + (s.id === selectedId ? ' selected' : '') + '>' + escapeHtml(s.label || s.id) + '</option>';

    '無需執行。<strong>套用是全有全無</strong>：預覽表裡任何一列有問題，確認套用時會整批不寫。' +
    '逐列的動作只能把系統算好的降級成「原樣保留」，不能反過來升級——資料不齊（缺席位、修業年限未設）' +

    '<div class="row">' +
      '<div class="field"><label>來源學期</label><select id="roll-from">' + semOptions(defaultFrom) + '</select></div>' +
      '<div class="field"><label>目標學期</label><select id="roll-to">' + semOptions(defaultTo) + '</select></div>' +
    '</div>' +
    '<button type="button" class="btn btn-primary" id="roll-preview-btn">產生預覽</button>' +
    '<div id="roll-preview" style="margin-top:14px;"></div>',
    { wide: true });

  $('roll-preview-btn').addEventListener('click', async function () {
    const btn = this;
    try {

function renderRolloverPreview() {
  const el = $('roll-preview');
  if (!el) return;
  if (!rolloverRows || !rolloverRows.length) { el.innerHTML = '<div class="empty-hint">沒有可處理的班級（停用/已刪除班級不納入）。</div>'; return; }
  el.innerHTML =
    '<div class="table-wrap"><table><thead><tr><th>系所</th><th>班級</th><th>現任導師</th><th>動作</th><th>接手來源</th><th>新導師</th><th>說明</th></tr></thead><tbody>' +
    rolloverRows.map(function (r, i) {
      // 每一列只允許兩個選項：plan 本身算出的動作，或降級成「原樣保留」。不能讓 admin
      // 在 UI 上把 plan 判的 keep「升級」成 inherit/vacate——那等於繞過 computeRolloverPlan_
      // 的所有守門（gate 4／cascadeDowngrade_／來源存在性…），真正該做的是先把資料修好
      // （建缺的席位、設修業年限）再重新產生預覽，不是硬點一個 plan 沒打算給的動作
      // （後端 applyRolloverPlan_ 也用同一條規則擋，這裡只是先不讓選項出現）。
      // alreadyDone 的列鎖死只能 keep——這班已經在目標學期做過一次，不該再被重複套用。
      const actionOpts = r.action === 'keep' ? ['keep'] : [r.action, 'keep'];
      const actionSel = '<select data-roll-action="' + i + '"' + (r.alreadyDone ? ' disabled' : '') + '>' +
        actionOpts.map(function (a) {
          return '<option value="' + a + '"' + (a === r.action ? ' selected' : '') + '>' + ROLLOVER_ACTION_LABELS[a] + '</option>';
        }).join('') + '</select>';
      return '<tr' + (r.uncertain ? ' style="background:var(--color-warning-bg);"' : '') + '>' +
        '<td data-label="系所">' + escapeHtml(r.deptName) + '</td>' +
        '<td data-label="班級">' + escapeHtml(r.displayName || r.name) + '</td>' +
        '<td data-label="現任導師">' + escapeHtml((r.tutors || []).join('、')) + '</td>' +
        '<td data-label="動作">' + actionSel + '</td>' +
        // 這兩欄只在真的會接手（action==='inherit'）時才填：被守門降級成 keep 的列
        // 其實不會有任何人交接，但 computeRolloverPlan_ 只清 sourceClassId/sourceTutors、
        // 刻意留著 sourceName 給 reason 措辭用——照 sourceName 印會讓「原樣保留」的列
        // 看起來像「這班會接手某某班」，而這正是誤按會出事的那張表，不能留這種歧義。
        '<td data-label="接手來源">' + escapeHtml(r.action === 'inherit' ? (r.sourceName || '') : '') + '</td>' +
        '<td data-label="新導師">' + escapeHtml(r.action === 'inherit' ? (r.sourceTutors || []).join('、') : '') + '</td>' +
        '<td data-label="說明">' + escapeHtml(r.reason || '') + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<p class="field-hint">標黃列表示系統無法完全確定（如找不到目標班/來源班），請逐列確認動作是否正確。</p>' +
    '<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">取消</button>' +
    '<button type="button" class="btn btn-primary" id="roll-apply-btn">確認套用</button></div>';

  $('roll-apply-btn').addEventListener('click', async function () {
    const btn = this;
    const rows = rolloverRows.map(function (r, i) {
      const sel = el.querySelector('[data-roll-action="' + i + '"]');
      const action = sel ? sel.value : r.action;
      return { classId: r.classId, action: action };
    });
    const nInherit = rows.filter(function (r) { return r.action === 'inherit'; }).length;
    const nVacate = rows.filter(function (r) { return r.action === 'vacate'; }).length;
    const nKeep = rows.length - nInherit - nVacate;
    if (!confirm('將有 ' + nInherit + ' 班換導師、' + nVacate + ' 班釋出導師（待指派）、' + nKeep + ' 班維持不變，確定套用？')) return;
    try {
      await withBtnPending(btn, async function () {
        const res = await proxyCall('adminRolloverApply', {
          fromSemester: $('roll-from').value, toSemester: $('roll-to').value, rows: rows,
        });
        let html;
        if (res.ok === false) {
          // 全有全無：後端一個字都沒寫，bootstrapData.classes 不能動（舊版無論如何都覆蓋，
          // 是 2026-08-11 事故的直接誘因之一——失敗列與成功列的界線在前端被抹平了）。
          html = '<div class="import-error-box"><div class="import-error-title">整批未套用（全有全無）——以下 ' +
            (res.errors || []).length + ' 列有問題，修正後請重新產生預覽：</div><ul>' +
            (res.errors || []).map(function (er) { return '<li>第 ' + (er.row + 1) + ' 列（' + escapeHtml(er.classId || '') + '）：' + escapeHtml(er.error) + '</li>'; }).join('') +
            '</ul></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">關閉</button></div>';
          showToast('套用失敗：整批未套用', 'error');
        } else {
          bootstrapData.classes = res.classes;
          renderNav();
          const a = res.applied || {};
          html = '<div class="empty-hint" style="color:var(--color-success);">套用完成：接手 ' + (a.inherited || 0) +
            ' 班、釋出 ' + (a.vacated || 0) + ' 班、維持 ' + (a.kept || 0) + ' 班不變（其中 ' + (a.unchanged || 0) + ' 班導師實際上沒有變動）。</div>' +
            '<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">關閉</button></div>';
          showToast('升級套用完成', 'success');
          if (adminTab === 'semesters') renderAdminSemesters();
        }
        el.innerHTML = html;
      });
    } catch (err) { showToast('套用失敗：' + err.message, 'error'); }
  });
}

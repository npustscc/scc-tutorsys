<!doctype html>
<!--
  server/login-template.html — 本地登入頁模板。
  由 server/scripts/build-public.js 注入 __ROOT_FOLDER_ID__ / __ENV_LABEL__ 後，
  輸出為 server/public/login.html（不直接部署本檔）。

  currentUser.picture 用法結論（已查 dev/index.html:270,293,529,743）：
    - LS_USER_KEY 存 { email, name, picture }
    - 唯一讀取點：`$('user-avatar').src = currentUser.picture || '';`
  若這裡把 picture 存成空字串，`currentUser.picture || ''` 短路後 img.src 仍會被設成
  空字串——多數瀏覽器把「顯式設定 src=''」解讀成「參照目前文件的 URL」，會多打一次
  對當前頁面的請求，且顯示破圖圖示。改存 1x1 透明 PNG 的 data URI，讓 picture 永遠
  是非空值，avatar 顯示空白但不破圖、不多打請求。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>屏科大導師資訊系統——區網登入（__ENV_LABEL__）</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    max-width: 420px; margin: 12vh auto; padding: 0 20px; line-height: 1.6;
  }
  h1 { font-size: 1.2rem; margin-bottom: .25rem; }
  .env-badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    background: #2d6cdf; color: #fff; font-size: .8rem; vertical-align: middle;
  }
  .hint { font-size: .85rem; opacity: .75; margin: .5rem 0 1.5rem; }
  .purpose { font-size: .8rem; line-height: 1.7; opacity: .85; text-align: left;
    margin: 0 0 1.4rem; padding: .6rem .75rem; border-left: 3px solid #2563eb; border-radius: 0 6px 6px 0;
    background: rgba(37, 99, 235, .06); }
  .purpose strong { color: #b91c1c; }
  form { display: flex; flex-direction: column; gap: .9rem; }
  label { font-size: .9rem; display: block; }
  input {
    width: 100%; box-sizing: border-box; padding: .55rem .6rem; font-size: 1rem;
    margin-top: .25rem; border: 1px solid #999; border-radius: 6px;
  }
  button {
    padding: .65rem; font-size: 1rem; cursor: pointer; border: none; border-radius: 6px;
    background: #2d6cdf; color: #fff;
  }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .error { color: #c0392b; font-size: .9rem; min-height: 1.3em; }
</style>
</head>
<body>
<h1>屏科大導師資訊系統 <span class="env-badge">__ENV_LABEL__</span></h1>
<p class="hint">此為校內自架伺服器登入；憑證效期至當日 24:00（台北時間）。</p>
<!-- 與 index.html 登入卡片的 .login-purpose 同一段文案（使用者 2026-08-18 指定）。
     兩個入口都要有：助理從哪一邊進來看到的說明都一樣。 -->
<p class="purpose">維護您負責系所的班級與導師名單。可以新增／刪除班級、增減導師、填寫校內分機與私人手機。<strong>導師的私人手機屬於高度個資</strong>：只有您與學諮中心看得到，不會出現在其他人的畫面。</p>
<form id="login-form" autocomplete="on">
  <label>帳號
    <!-- type=text 而非 email：帳號允許只打 @ 之前那段（伺服器端 resolveLoginEmail_ 補全），
         用 type=email 會被瀏覽器原生驗證擋在送出之前。 -->
    <input type="text" id="email" required autocomplete="username" placeholder="完整 email，或只打 @ 前面那段">
  </label>
  <label>密碼
    <input type="password" id="password" required autocomplete="current-password">
  </label>
  <div class="error" id="error" role="alert"></div>
  <button type="submit" id="submit-btn">登入</button>
</form>

<!-- 初始密碼（系辦助理＝校內分機）尚未換掉時，登入成功後先停在這一步邀請改密碼。
     「稍後再做」直接進系統——使用者明確要求可以延後，不擋人做事。 -->
<form id="change-form" autocomplete="off" style="display:none;">
  <p class="hint" id="change-hint">您目前使用的是初始密碼（校內分機），建議立即更換。</p>
  <label>新密碼
    <input type="password" id="new-password" autocomplete="new-password" placeholder="至少 8 個字元，不能只有數字">
  </label>
  <label>再輸入一次
    <input type="password" id="new-password2" autocomplete="new-password">
  </label>
  <div class="error" id="change-error" role="alert"></div>
  <button type="submit" id="change-btn">更改密碼並進入系統</button>
  <button type="button" id="skip-btn" style="background:transparent; color:inherit; text-decoration:underline;">稍後再做，先進系統</button>
</form>
<script>
(function () {
  'use strict';
  var ROOT_FOLDER_ID = '__ROOT_FOLDER_ID__';
  var LS_USER_KEY    = 'tutor_user_' + ROOT_FOLDER_ID;
  var LS_SESSION_KEY = 'tutor_session_' + ROOT_FOLDER_ID;
  // 1x1 透明 PNG（見檔頭註解）。
  var BLANK_AVATAR = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=';

  function readSession() {
    try { return JSON.parse(localStorage.getItem(LS_SESSION_KEY) || 'null'); } catch (e) { return null; }
  }
  // 既有 session 未過期 → 直接跳過登入頁。
  var existing = readSession();
  if (existing && existing.token && Number(existing.exp) > Math.floor(Date.now() / 1000) + 30) {
    location.href = './index.html';
    return;
  }

  var form = document.getElementById('login-form');
  var errorEl = document.getElementById('error');
  var btn = document.getElementById('submit-btn');
  var changeForm = document.getElementById('change-form');
  var changeError = document.getElementById('change-error');
  var changeBtn = document.getElementById('change-btn');
  var loggedInEmail = '';
  var currentPassword = '';

  document.getElementById('skip-btn').addEventListener('click', function () {
    location.href = './index.html';
  });

  changeForm.addEventListener('submit', function (ev) {
    ev.preventDefault();
    changeError.textContent = '';
    var pw1 = document.getElementById('new-password').value;
    var pw2 = document.getElementById('new-password2').value;
    if (pw1 !== pw2) { changeError.textContent = '兩次輸入的新密碼不一致'; return; }
    changeBtn.disabled = true;
    fetch('./change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: loggedInEmail, currentPassword: currentPassword, newPassword: pw1 }),
    }).then(function (res) { return res.json(); }).then(function (json) {
      if (!json || json.success !== true) {
        changeError.textContent = (json && json.error) || '更改失敗，請稍後再試';
        changeBtn.disabled = false;
        return;
      }
      location.href = './index.html';
    }).catch(function () {
      changeError.textContent = '連線失敗，請確認伺服器狀態';
      changeBtn.disabled = false;
    });
  });

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    errorEl.textContent = '';
    btn.disabled = true;
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    fetch('./login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password }),
    }).then(function (res) { return res.json(); }).then(function (json) {
      if (!json || json.success !== true) {
        errorEl.textContent = (json && json.error) || '登入失敗，請稍後再試';
        btn.disabled = false;
        return;
      }
      var data = json.data || {};
      try {
        localStorage.setItem(LS_SESSION_KEY, JSON.stringify({ token: data.sessionToken, exp: data.exp, email: data.email }));
        localStorage.setItem(LS_USER_KEY, JSON.stringify({ email: data.email, name: data.name || data.email, picture: BLANK_AVATAR }));
      } catch (e) { /* localStorage 寫入失敗（無痕模式等）：跳轉後前端會偵測到無 session 再導回登入頁 */ }
      // session 已經發下來了，改密碼與否都不影響能不能進系統——所以這裡只是「邀請」。
      if (data.mustChangePassword === true) {
        loggedInEmail = data.email;
        currentPassword = password;
        form.style.display = 'none';
        changeForm.style.display = 'flex';
        document.getElementById('new-password').focus();
        return;
      }
      location.href = './index.html';
    }).catch(function () {
      errorEl.textContent = '連線失敗，請確認伺服器狀態';
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
